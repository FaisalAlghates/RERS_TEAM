<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Camera | RERS System</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, arrayUnion, getDocs } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAurJx-nSpVdj0ctPx8agoIIVTi8k3Wtpg",
            authDomain: "rersweb.firebaseapp.com",
            projectId: "rersweb",
            storageBucket: "rersweb.firebasestorage.app",
            messagingSenderId: "432558250053",
            appId: "1:432558250053:web:07fc91665244a2d93feb2c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                history.pushState({}, '', '../web/login Page.html');
                window.location.href = '../web/login Page.html';
            }
        });

        async function validateUniqueId(uniqueId) {
            const querySnapshot = await getDocs(collection(db, "buildings"));
            for (const doc of querySnapshot.docs) {
                const building = doc.data();
                if (building.cameras?.some(cam => cam.uniqueId === uniqueId)) {
                    return false;
                }
            }
            return true;
        }

        window.addCamera = function () {
            onAuthStateChanged(auth, async (user) => {
                const addButton = document.querySelector('button[onclick="addCamera()"]');
                const loading = document.getElementById("loading");

                if (!user) {
                    alert("You must be logged in to add a camera!");
                    return;
                }

                const buildingId = localStorage.getItem('currentBuildingId');
                if (!buildingId) {
                    alert("No building selected. Please add a building first.");
                    history.pushState({}, '', 'add_building.htm');
                    window.location.href = 'add_building.htm';
                    return;
                }

                const cameraLocation = document.getElementById("cameraLocation").value.trim();
                const cameraURL = document.getElementById("cameraURL").value.trim();
                const uniqueId = document.getElementById("uniqueId").value.trim();
                const isPrimary = document.getElementById("primaryCamera").checked;
                const connectionType = document.getElementById("connectionType").value;

                if (!cameraLocation || !cameraURL || !uniqueId) {
                    alert("Please fill in all camera fields!");
                    return;
                }
                if (!/^https?:\/\//i.test(cameraURL)) {
                    alert("Please enter a valid URL starting with http:// or https://");
                    return;
                }
                if (!(await validateUniqueId(uniqueId))) {
                    alert("Unique ID already exists. Please choose another.");
                    return;
                }

                addButton.disabled = true;
                loading.style.display = "block";

                const cameraData = {
                    location: cameraLocation,
                    url: cameraURL,
                    uniqueId,
                    isPrimary,
                    connectionType,
                    addedBy: user.email,
                    timestamp: new Date().toISOString()
                };

                try {
                    const buildingRef = doc(db, "buildings", buildingId);
                    await updateDoc(buildingRef, {
                        cameras: arrayUnion(cameraData)
                    });
                    alert("Camera added successfully!");
                    localStorage.removeItem('currentBuildingId');
                    history.pushState({}, '', 'dashboard.htm');
                    window.location.href = 'dashboard.htm';
                } catch (error) {
                    console.error("Error adding camera:", error);
                    alert("Failed to add camera. Please try again.");
                } finally {
                    addButton.disabled = false;
                    loading.style.display = "none";
                }
            });
        };
    </script>

    <style>

            border-radius: 5px;
        }

        .sidebar nav ul li a:hover {
            background: rgba(255, 0, 0, 0.2);
            color: #fff;
        }

        .content {
            margin-left: 270px;
            padding: 40px;
            width: calc(100% - 270px);
            text-align: center;
            overflow-y: auto;
        }

        .form-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            text-align: center;
            width: 90%;
            max-width: 600px;
            margin: auto;
        }

        .form-container h2 {
            font-size: 24px;
            text-shadow: 0 0 10px var(--primary-color);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            outline: none;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-top: 15px;
        }

        .primary-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-right: 10px;
        }

        .form-container button {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
            margin-top: 20px;
        }

        .form-container button:hover {
            background: darkred;
        }

        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .button-group button {
            flex: 1;
        }

        .loading {
            display: none;
            font-size: 16px;
            color: var(--primary-color);
        }

        .loading::before {
            content: "";
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--primary-color);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                border-right: none;
                border-bottom: 2px solid var(--primary-color);
                box-shadow: none;
            }

            .content {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }

            .form-container {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <nav>
            <ul>
                <li><a href="../web/dashboard.htm">dashboard</a></li>
                <li><a href="../web/add_building.htm">Add Buildings</a></li>
                <li><a href="../web/monitoring.html">Monitoring</a></li>
                <li><a href="../web/reports.html">Reports</a></li>

                <li><a href="../web/US.htm">About Us</a></li>
                <li><a href="../web/logout.htm">Logout</a></li>

        </nav>

    <div class="content">
        <div class="form-container">
            <h2>Add New Camera</h2>
            <div class="input-group">
                <input type="text" id="cameraLocation" placeholder="Camera Location">
            </div>
            <div class="input-group">
                <input type="text" id="cameraURL" placeholder="Camera URL (e.g., https://...)">
            </div>
            <div class="input-group">
                <input type="text" id="uniqueId" placeholder="Unique Camera ID">
            </div>
            <div class="input-group">
                <select id="connectionType">
                    <option value="rtsp">RTSP</option>
                    <option value="http">HTTP</option>
                    <option value="https">HTTPS</option>
                    <option value="websocket">WebSocket</option>
                </select>
            </div>
            <div class="checkbox-wrapper">
                <input type="checkbox" id="primaryCamera" class="primary-checkbox">
                <label for="primaryCamera">Set as Primary Camera</label>
            </div>
            <p class="loading" id="loading">Adding camera...</p>
            <div class="button-group">
                <button onclick="history.pushState({}, '', 'add_sensor.html'); window.location.href='add_sensor.html'">Previous</button>
                <button onclick="addCamera()">Add Camera</button>
                <button onclick="history.pushState({}, '', 'dashboard.htm'); window.location.href='dashboard.htm'">Finish</button>
            </div>
        </div>
    </div>
