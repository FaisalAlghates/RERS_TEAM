<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Set character encoding to UTF-8 -->
  <meta charset="UTF-8" />
  <!-- Ensure responsive viewport scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Page title -->
  <title>Add Camera | RERS System</title>
  <!-- Include Font Awesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script type="module">
    /* Import Firebase SDK modules */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      updateDoc,
      getDocs,
      query,
      where,
      arrayUnion,
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
    import {
      getAuth,
      onAuthStateChanged,
    } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

    /* Firebase configuration object */
    const firebaseConfig = {
      apiKey: "AIzaSyAurJx-nSpVdj0ctPx8agoIIVTi8k3Wtpg",
      authDomain: "rersweb.firebaseapp.com",
      projectId: "rersweb",
      storageBucket: "rersweb.firebasestorage.app",
      messagingSenderId: "432558250053",
      appId: "1:432558250053:web:07fc91665244a2d93feb2c",
    };

    /* Initialize Firebase app */
    const app = initializeApp(firebaseConfig);
    /* Initialize Firestore database */
    const db = getFirestore(app);
    /* Initialize Firebase Authentication */
    const auth = getAuth(app);

    /* Function to populate building dropdown */
    async function populateBuildingData() {
      try {
        /* Get current authenticated user */
        const user = auth.currentUser;
        if (!user) {
          console.log("User not authenticated");
          return;
        }

        /* DOM element for building selection */
        const buildingSelect = document.getElementById("buildingName");
        /* Initialize dropdown with default option */
        buildingSelect.innerHTML =
          '<option value="">Select a Building</option>';

        /* Query buildings added by the current user */
        const q = query(
          collection(db, "buildings"),
          where("addedBy", "==", user.email)
        );
        const querySnapshot = await getDocs(q);
        querySnapshot.forEach((doc) => {
          /* Populate building dropdown */
          const data = doc.data();
          const option = document.createElement("option");
          option.value = doc.id;
          option.text = data.buildingName;
          buildingSelect.appendChild(option);
        });

        /* Log fetched buildings for debugging */
        console.log(
          "Buildings fetched for camera:",
          querySnapshot.docs.map((doc) => doc.data())
        );
      } catch (error) {
        /* Log errors during building fetch */
        console.error("Error fetching buildings:", error);
      }
    }

    /* Handle authentication state changes */
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        /* Redirect to login if not authenticated */
        window.location.href = "../web/loginPage.html";
      } else {
        /* Populate building data if authenticated */
        populateBuildingData();
      }
    });

    /* Function to validate unique camera ID */
    async function validateUniqueId(uniqueId) {
      const querySnapshot = await getDocs(collection(db, "buildings"));
      for (const doc of querySnapshot.docs) {
        const building = doc.data();
        if (building.cameras?.some((cam) => cam.uniqueId === uniqueId)) {
          return false;
        }
      }
      return true;
    }

    /* Handle connection type radio button changes */
    const connectionRadios = document.querySelectorAll('input[name="connection"]');
    connectionRadios.forEach(radio => {
      radio.addEventListener('change', function () {
        /* Hide all connection details */
        document.querySelectorAll('.connection-details').forEach(details => {
          details.style.display = 'none';
        });
        /* Show details for selected connection type */
        const detailsDiv = document.getElementById(this.value + "Connection");
        if (this.checked && detailsDiv) {
          detailsDiv.style.display = 'block';
        }
      });
    });

    /* Function to add a new camera */
    window.addCamera = function () {
      onAuthStateChanged(auth, async (user) => {
        /* DOM elements for button and loading indicator */
        const addButton = document.querySelector(
          'button[onclick="addCamera()"]'
        );
        const loading = document.getElementById("loading");

        /* Check if user is authenticated */
        if (!user) {
          alert("You must be logged in to add a camera!");
          return;
        }

        /* Get selected building ID */
        const buildingId = document.getElementById("buildingName").value;
        if (!buildingId) {
          alert("No building selected. Please select a building.");
          window.location.href = "add_building.htm";
          return;
        }

        /* Get camera input values */
        const cameraLocation = document
          .getElementById("cameraLocation")
          .value.trim();
        const cameraURL = document.getElementById("cameraURL").value.trim();
        const uniqueId = document.getElementById("uniqueId").value.trim();
        const isPrimary = document.getElementById("primaryCamera").checked;

        /* Validate input fields */
        if (!cameraLocation || !cameraURL || !uniqueId) {
          alert("Please fill in all camera fields!");
          return;
        }
        /* Validate URL format */
        if (!/^https?:\/\//i.test(cameraURL)) {
          alert("Please enter a valid URL starting with http:// or https://");
          return;
        }
        /* Check for unique ID */
        if (!(await validateUniqueId(uniqueId))) {
          alert("Unique ID already exists. Please choose another.");
          return;
        }

        /* Collect connection details */
        const connections = {};
        connectionRadios.forEach(radio => {
          if (radio.checked) {
            const detailsDiv = document.getElementById(radio.value + "Connection");
            if (detailsDiv) {
              const inputs = detailsDiv.querySelectorAll('input');
              connections[radio.value] = Array.from(inputs).map(input => input.value.trim());
            }
          }
        });

        /* Disable button and show loading indicator */
        addButton.disabled = true;
        loading.style.display = "block";

        /* Construct camera data object */
        const cameraData = {
          location: cameraLocation,
          url: cameraURL,
          uniqueId,
          isPrimary,
          connections,
          addedBy: user.email,
          timestamp: new Date().toISOString(),
        };

        try {
          /* Update building document with new camera */
          const buildingRef = doc(db, "buildings", buildingId);
          await updateDoc(buildingRef, {
            cameras: arrayUnion(cameraData),
          });
          /* Notify user of success and redirect */
          alert("Camera added successfully!");
          window.location.href = "dashboard.html";
        } catch (error) {
          /* Handle errors during camera addition */
          console.error("Error adding camera:", error);
          alert("Failed to add camera. Please try again.");
        } finally {
          /* Re-enable button and hide loading indicator */
          addButton.disabled = false;
          loading.style.display = "none";
        }
      });
    };
  </script>

  <style>
    /* Import Orbitron font from Google Fonts */
    @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap");

    /* Define CSS custom properties for theming */
    :root {
      --primary-color: #ff0000;
      /* Primary color for the theme */
      --secondary-color: #00ff00;
      /* Secondary color for the theme */
      --bg-gradient: radial-gradient(circle,
          rgba(10, 10, 10, 1) 10%,
          rgba(0, 0, 0, 1) 80%);
      /* Background gradient */
      --sidebar-gradient: linear-gradient(180deg, #2a2a2a, #000);
      /* Sidebar gradient */
      --card-bg: rgba(255, 255, 255, 0.1);
      /* Card background color */
      --card-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
      /* Card shadow effect */
    }

    /* General body styling */
    body {
      margin: 0;
      /* Remove default margin */
      padding: 0;
      /* Remove default padding */
      background: var(--bg-gradient);
      /* Apply background gradient */
      color: #fff;
      /* Set text color to white */
      font-family: "Orbitron", sans-serif;
      /* Set font to Orbitron */
      display: flex;
      /* Use flexbox for layout */
      height: 100vh;
      /* Full viewport height */
    }

    /* Sidebar styling */
    .sidebar {
      width: 250px;
      /* Fixed sidebar width */
      background: var(--sidebar-gradient);
      /* Apply sidebar gradient */
      padding: 20px;
      /* Inner padding */
      position: fixed;
      /* Fix sidebar position */
      height: 100vh;
      /* Full viewport height */
      box-shadow: 4px 0 15px rgba(255, 0, 0, 0.5);
      /* Sidebar shadow */
      border-right: 2px solid var(--primary-color);
      /* Right border */
    }

    /* Sidebar navigation styling */
    .sidebar nav ul {
      list-style: none;
      /* Remove bullet points */
      padding: 0;
      /* Remove padding */
    }

    /* Sidebar list items */
    .sidebar nav ul li {
      padding: 15px 0;
      /* Vertical padding */
      text-align: center;
      /* Center text */
    }

    /* Sidebar link styling */
    .sidebar nav ul li a {
      color: var(--primary-color);
      /* Link color */
      text-decoration: none;
      /* Remove underline */
      font-size: 18px;
      /* Font size */
      font-weight: bold;
      /* Bold text */
      display: block;
      /* Block-level element */
      padding: 10px;
      /* Inner padding */
      border-radius: 5px;
      /* Rounded corners */
    }

    /* Sidebar link hover effect */
    .sidebar nav ul li a:hover {
      background: rgba(255, 0, 0, 0.2);
      /* Semi-transparent background on hover */
      color: #fff;
      /* White text on hover */
    }

    /* Main content area */
    .content {
      margin-left: 270px;
      /* Offset for sidebar */
      padding: 40px;
      /* Inner padding */
      width: calc(100% - 300px);
      /* Adjust width for sidebar */
      text-align: center;
      /* Center text */
      overflow-y: auto;
      /* Enable vertical scrolling */
    }

    /* Form container styling */
    .form-container {
      background: var(--card-bg);
      /* Card background */
      padding: 30px;
      /* Inner padding */
      border-radius: 15px;
      /* Rounded corners */
      box-shadow: var(--card-shadow);
      /* Card shadow */
      text-align: center;
      /* Center text */
      width: 90%;
      /* Responsive width */
      max-width: 600px;
      /* Maximum width */
      margin: auto;
      /* Center horizontally */
    }

    /* Form heading styling */
    .form-container h2 {
      font-size: 24px;
      /* Font size */
      text-shadow: 0 0 10px var(--primary-color);
      /* Text shadow effect */
      margin-bottom: 20px;
      /* Bottom margin */
    }

    /* Input group for form fields */
    .input-group {
      margin-bottom: 15px;
      /* Bottom margin */
    }

    /* Input styling */
    .input-group input {
      width: 96%;
      /* Nearly full width */
      padding: 12px;
      /* Inner padding */
      border-radius: 8px;
      /* Rounded corners */
      border: none;
      /* No border */
      font-size: 16px;
      /* Font size */
      background: rgba(255, 255, 255, 0.2);
      /* Semi-transparent background */
      color: #fff;
      /* Text color */
      outline: none;
      /* Remove outline */
    }

    /* Select element styling */
    .input-group select {
      width: 100%;
      /* Full width */
      padding: 12px;
      /* Inner padding */
      border-radius: 8px;
      /* Rounded corners */
      border: none;
      /* No border */
      font-size: 16px;
      /* Font size */
      background: rgba(255, 255, 255, 0.2);
      /* Semi-transparent background */
      color: #fff;
      /* Text color */
      outline: none;
      /* Remove outline */
    }

    /* Checkbox wrapper styling */
    .checkbox-wrapper {
      display: flex;
      /* Flexbox layout */
      align-items: center;
      /* Vertical alignment */
      justify-content: flex-start;
      /* Left-align content */
      margin-top: 15px;
      /* Top margin */
    }

    /* Checkbox styling */
    .primary-checkbox {
      width: 18px;
      /* Checkbox size */
      height: 18px;
      /* Checkbox size */
      cursor: pointer;
      /* Pointer cursor */
      margin-right: 10px;
      /* Right margin */
    }

    /* Form button styling */
    .form-container button {
      width: 100%;
      /* Full width */
      padding: 15px;
      /* Inner padding */
      background: var(--primary-color);
      /* Button background */
      color: white;
      /* Text color */
      font-weight: bold;
      /* Bold text */
      border: none;
      /* No border */
      border-radius: 5px;
      /* Rounded corners */
      cursor: pointer;
      /* Pointer cursor */
      font-size: 18px;
      /* Font size */
      transition: 0.3s;
      /* Smooth transition */
      margin-top: 20px;
      /* Top margin */
    }

    /* Button hover effect */
    .form-container button:hover {
      background: darkred;
      /* Darker red on hover */
    }

    /* Button group for multiple buttons */
    .button-group {
      display: flex;
      /* Flexbox layout */
      gap: 10px;
      /* Gap between buttons */
      width: 100%;
      /* Full width */
    }

    /* Button group button styling */
    .button-group button {
      flex: 1;
      /* Equal flex growth */
    }

    /* Loading indicator styling */
    .loading {
      display: none;
      /* Hidden by default */
      font-size: 16px;
      /* Font size */
      color: var(--primary-color);
      /* Text color */
    }

    /* Loading spinner pseudo-element */
    .loading::before {
      content: "";
      /* Empty content */
      display: inline-block;
      /* Inline-block display */
      width: 16px;
      /* Spinner size */
      height: 16px;
      /* Spinner size */
      border: 2px solid var(--primary-color);
      /* Border color */
      border-top-color: transparent;
      /* Transparent top border */
      border-radius: 50%;
      /* Circular shape */
      animation: spin 1s linear infinite;
      /* Spin animation */
      margin-right: 8px;
      /* Right margin */
    }

    /* Spin animation keyframes */
    @keyframes spin {
      to {
        transform: rotate(360deg);
        /* Full rotation */
      }
    }

    /* Connection types section */
    .connection-types {
      width: 100%;
      /* Full width */
      margin: 15px 0;
      /* Vertical margin */
      text-align: left;
      /* Left-align text */
    }

    /* Individual connection type */
    .connection-type {
      margin-bottom: 10px;
      /* Bottom margin */
    }

    /* Connection type label styling */
    .connection-type label {
      display: flex;
      /* Flexbox layout */
      align-items: center;
      /* Vertical alignment */
      cursor: pointer;
      /* Pointer cursor */
    }

    /* Connection type input styling */
    .connection-type input {
      margin-right: 10px;
      /* Right margin */
    }

    /* Connection details section */
    .connection-details {
      margin-left: 25px;
      /* Left indent */
      margin-top: 5px;
      /* Top margin */
      display: none;
      /* Hidden by default */
    }

    /* Connection details input styling */
    .connection-details input {
      width: 100%;
      /* Full width */
      padding: 8px;
      /* Inner padding */
      margin: 5px 0;
      /* Vertical margin */
      border-radius: 5px;
      /* Rounded corners */
      border: none;
      /* No border */
      background: rgba(255, 255, 255, 0.2);
      /* Semi-transparent background */
      color: #fff;
      /* Text color */
    }

    /* Responsive design for smaller screens */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
        /* Stack elements vertically */
      }

      .sidebar {
        width: 100%;
        /* Full width */
        height: auto;
        /* Auto height */
        position: static;
        /* Remove fixed positioning */
        border-right: none;
        /* Remove right border */
        border-bottom: 2px solid var(--primary-color);
        /* Add bottom border */
        box-shadow: none;
        /* Remove shadow */
      }

      .content {
        margin-left: 0;
        /* Remove sidebar offset */
        width: 100%;
        /* Full width */
        padding: 20px;
        /* Reduced padding */
      }

      .form-container {
        padding: 15px;
        /* Reduced padding */
      }
    }
  </style>
</head>

  <aside class="sidebar">

  <!-- Main content area -->
  <div class="content">
    <!-- Form container for adding a camera -->
    <div class="form-container">
      <h2>Add New Camera</h2>
      <!-- Building selection -->
      <div class="input-group">
        <select id="buildingName"></select>
      </div>
      <!-- Camera location input -->
      <div class="input-group">
        <input type="text" id="cameraLocation" placeholder="Camera Location" />
      </div>
      <!-- Camera URL input -->
      <div class="input-group">
        <input type="text" id="cameraURL" placeholder="Camera URL (e.g., https://...)" />
      </div>
      <!-- Unique camera ID input -->
      <div class="input-group">
        <input type="text" id="uniqueId" placeholder="Unique Camera ID" />
      </div>

      <!-- Connection types selection -->
      <div class="connection-types">
        <h3>Connection Types</h3>
        <!-- RTSP connection option -->
        <div class="connection-type">
          <label><input type="radio" name="connection" value="rtps"> RTSP</label>
        </div>
        <!-- HTTP connection option -->
        <div class="connection-type">
          <label><input type="radio" name="connection" value="http"> HTTP</label>
        </div>
        <!-- HTTPS connection option -->
        <div class="connection-type">
          <label><input type="radio" name="connection" value="https"> HTTPS</label>
        </div>
        <!-- WebSocket connection option -->
        <div class="connection-type">
          <label><input type="radio" name="connection" value="websocket"> WebSocket</label>
        </div>
      </div>

      <!-- Primary camera checkbox -->
      <div class="checkbox-wrapper">
        <input type="checkbox" id="primaryCamera" class="primary-checkbox" />
        <label for="primaryCamera">Set as Primary Camera</label>
      </div>

      <!-- Loading indicator -->
      <p class="loading" id="loading">Adding camera...</p>
      <!-- Navigation and action buttons -->
      <div class="button-group">
        <button onclick="window.location.href='add_sensor.html'">
          Previous
        </button>
        <button onclick="addCamera()">Add Camera</button>
      </div>
    </div>
  </div>
