<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | RERS System</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, rgba(10, 10, 10, 1) 10%, rgba(0, 0, 0, 1) 80%);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #2a2a2a, #000);
            padding: 20px;
            position: fixed;
            height: 100vh;
            box-shadow: 4px 0 15px rgba(255, 0, 0, 0.5);
            border-right: 2px solid #ff0000;
        }

        .sidebar nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar nav ul li {
            padding: 15px 0;
            text-align: center;
        }

        .sidebar nav ul li a {
            color: #ff0000;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            display: block;
            padding: 10px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .sidebar nav ul li a:hover {
            background: rgba(255, 0, 0, 0.2);
            color: #fff;
        }

        .content {
            margin-left: 270px;
            padding: 40px;
            width: calc(100% - 270px);
            text-align: center;
            overflow-y: auto;
        }

        .report-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            text-align: center;
            width: 90%;
            max-width: 900px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        h2 {
            margin-bottom: 20px;
            font-size: 26px;
            text-transform: uppercase;
        }

        .filter-options {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
        }

        .filter-options select {
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: none;
            font-size: 16px;
            width: 200px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-options select:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .filter-button {
            padding: 12px 20px;
            background: red;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .filter-button:hover {
            background: darkred;
        }

        .report-list {
            width: 100%;
            text-align: left;
            margin-top: 20px;
        }

        .report-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 16px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }

        .report-item:hover {
            background: rgba(255, 255, 255, 0.3);
        }

    </style>
</head>
<body>
    <aside class="sidebar">
        <nav>
            <ul>
                <li><a href="../web/dashboard.htm">dashboard</a></li>
                <li><a href="../web/add_building.htm">Add Buildings</a></li>
                <li><a href="../web/monitoring.html">Monitoring</a></li>
                <li><a href="../web/reports.html">Reports</a></li>
                <li><a href="../web/payment .htm">Payment</a></li>
                <li><a href="../web/US.htm">About Us</a></li>
                <li><a href="../web/logout.htm">Logout</a></li>
            </ul>
        </nav>
    </aside>

    <div class="content">
        <div class="report-container">
            <h2>Reports</h2>

            <div class="filter-options">
                <select id="reportType">
                    <option value="daily">Daily Report</option>
                    <option value="weekly">Weekly Report</option>
                    <option value="monthly">Monthly Report</option>
                    <option value="yearly">Yearly Report</option>
                </select>
                <button class="filter-button" onclick="filterReports()">Filter</button>
            </div>

            <div class="report-list" id="reportList"></div>
        </div>
    </div>

    <script>
        const reports = [
            { type: "daily", details: "Daily maintenance completed for security systems." },
            { type: "weekly", details: "Weekly status check on emergency alerts." },
            { type: "monthly", details: "Monthly incident report generated." },
            { type: "yearly", details: "Yearly system audit completed successfully." }
        ];

        function filterReports() {
            const reportType = document.getElementById("reportType").value;
            const reportList = document.getElementById("reportList");

            reportList.innerHTML = "";

            reports.forEach(report => {
                if (report.type === reportType || reportType === "all") {
                    const item = document.createElement("div");
                    item.className = "report-item";
                    item.innerHTML = `<strong>${report.type.toUpperCase()} REPORT</strong><br>${report.details}`;
                    reportList.appendChild(item);
                }
            });
        }

        window.onload = filterReports;
    </script>
</body>
</html>
