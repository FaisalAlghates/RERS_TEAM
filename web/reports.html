<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports | RERS System</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAurJx-nSpVdj0ctPx8agoIIVTi8k3Wtpg",
            authDomain: "rersweb.firebaseapp.com",
            projectId: "rersweb",
            storageBucket: "rersweb.firebasestorage.app",
            messagingSenderId: "432558250053",
            appId: "1:432558250053:web:07fc91665244a2d93feb2c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const staticReports = [
            { type: "daily", details: "Daily maintenance completed for security systems.", timestamp: "2025-05-01T10:00:00Z" },
            { type: "weekly", details: "Weekly status check on emergency alerts.", timestamp: "2025-04-30T10:00:00Z" },
            { type: "monthly", details: "Monthly incident report generated.", timestamp: "2025-04-01T10:00:00Z" },
            { type: "yearly", details: "Yearly system audit completed successfully.", timestamp: "2025-01-01T10:00:00Z" }
        ];

        function renderReports(reports) {
            const reportList = document.getElementById("reportList");
            reportList.innerHTML = "";

            reports.forEach(report => {
                const item = document.createElement("div");
                item.className = report.isBacklog ? "report-item backlog" : "report-item";
                if (report.isBacklog) {
                    item.innerHTML = `
                        <strong>BACKLOG: ${report.details}</strong><br>
                        Sensor: ${report.sensorInfo.type} | Location: ${report.sensorInfo.location} | 
                        Building: ${report.sensorInfo.buildingName} | Floor: ${report.sensorInfo.floor} | 
                        Unique ID: ${report.sensorInfo.uniqueId} | 
                        Temperature: ${report.sensorInfo.temperature}°C<br>
                        Timestamp: ${new Date(report.timestamp).toLocaleString()}`;
                } else {
                    item.innerHTML = `<strong>${report.type.toUpperCase()} REPORT</strong><br>${report.details}<br>
                        Timestamp: ${new Date(report.timestamp).toLocaleString()}`;
                }
                reportList.appendChild(item);
            });
        }

        function filterReports(userEmail) {
            const reportType = document.getElementById("reportType").value;
            const sortOrder = document.getElementById("sortOrder").value;

            let allReports = [];

            // Filter static reports
            staticReports.forEach(report => {
                if (report.type === reportType || reportType === "all") {
                    allReports.push({ ...report, isBacklog: false });
                }
            });

            // Fetch and filter Firestore reports bound to the logged-in user
            if (reportType === "daily" || reportType === "all") {
                const q = query(collection(db, "reports"), where("type", "==", "daily"), where("sensorInfo.addedBy", "==", userEmail));
                onSnapshot(q, (snapshot) => {
                    const firestoreReports = [];
                    snapshot.forEach((doc) => {
                        const report = doc.data();
                        firestoreReports.push({ ...report, isBacklog: true });
                    });

                    // Combine static and Firestore reports
                    allReports = [...allReports, ...firestoreReports];

                    // Sort reports based on timestamp
                    allReports.sort((a, b) => {
                        const dateA = new Date(a.timestamp);
                        const dateB = new Date(b.timestamp);
                        return sortOrder === "newest" ? dateB - dateA : dateA - dateB;
                    });

                    renderReports(allReports);
                }, (error) => {
                    console.error("Error loading backlog reports:", error);
                });
            } else {
                // Sort static reports only if no Firestore reports are fetched
                allReports.sort((a, b) => {
                    const dateA = new Date(a.timestamp);
                    const dateB = new Date(b.timestamp);
                    return sortOrder === "newest" ? dateB - dateA : dateA - dateB;
                });
                renderReports(allReports);
            }
        }

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = 'loginPage.html';
            } else {
                filterReports(user.email);
                document.querySelector('.filter-button').addEventListener('click', () => filterReports(user.email));
                document.getElementById("sortOrder").addEventListener('change', () => filterReports(user.email));
            }
        });
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        :root {
            --primary-color: #ff0000;
            --bg-gradient: radial-gradient(circle, rgba(10, 10, 10, 1) 10%, rgba(0, 0, 0, 1) 80%);
            --sidebar-gradient: linear-gradient(180deg, #2a2a2a, #000);
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background: var(--sidebar-gradient);
            padding: 20px;
            position: fixed;
            height: 100vh;
            box-shadow: 4px 0 15px rgba(255, 0, 0, 0.5);
            border-right: 2px solid var(--primary-color);
        }

        .sidebar nav ul {
            list-style: none;
            padding: 0;
        }

        .sidebar nav ul li {
            padding: 15px 0;
            text-align: center;
        }

        .sidebar nav ul li a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            display: block;
            padding: 10px;
            border-radius: 5px;
        }

        .sidebar nav ul li a:hover {
            background: rgba(255, 0, 0, 0.2);
            color: #fff;
        }

        .content {
            margin-left: 270px;
            padding: 40px;
            width: calc(100% - 270px);
            text-align: center;
            overflow-y: auto;
        }

        .report-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            text-align: center;
            width: 90%;
            max-width: 900px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        h2 {
            margin-bottom: 20px;
            font-size: 26px;
            text-transform: uppercase;
        }

        .filter-options {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            margin-bottom: 20px;
        }

        .filter-options select {
            padding: 12px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: none;
            font-size: 16px;
            width: 200px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .filter-options select:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .filter-button {
            padding: 12px 20px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .filter-button:hover {
            background: darkred;
        }

        .report-list {
            width: 100%;
            text-align: left;
            margin-top: 20px;
        }

        .report-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 16px;
            backdrop-filter: blur(5px);
            transition: 0.3s;
        }

        .report-item.backlog {
            background: rgba(255, 0, 0, 0.2);
        }

        .report-item:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <nav>
            <ul>
                <li><a href="../web/dashboard.html">dashboard</a></li>
                <li><a href="../web/add_building.html">Add Buildings</a></li>
                <li><a href="../web/monitoring.html">Monitoring</a></li>
                <li><a href="../web/reports.html">Reports</a></li>
                <li><a href="../web/payment.html">Payment</a></li>
                <li><a href="../web/US.html">About Us</a></li>
                <li><a href="../web/logout.html">Logout</a></li>
            </ul>
        </nav>
    </aside>

    <div class="content">
        <div class="report-container">
            <h2>Reports</h2>

            <div class="filter-options">
                <select id="reportType">
                    <option value="daily">Daily Report</option>
                    <option value="weekly">Weekly Report</option>
                    <option value="monthly">Monthly Report</option>
                    <option value="yearly">Yearly Report</option>
                    <option value="all">All Reports</option>
                </select>
                <select id="sortOrder">
                    <option value="newest">Newest to Oldest</option>
                    <option value="oldest">Oldest to Newest</option>
                </select>
                <button class="filter-button">Filter</button>
            </div>

            <div class="report-list" id="reportList"></div>
        </div>
    </div>
</body>

</html>
