<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | RERS System</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, rgba(10, 10, 10, 1) 10%, rgba(0, 0, 0, 1) 80%);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
        }

        .clock {
            font-size: 50px;
            font-weight: bold;
            text-align: center;
            color: red;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
            margin-bottom: 30px;
        }

        .signup-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            width: 90%;
            max-width: 400px;
            animation: fadeIn 1s ease-in-out;
        }

        .signup-container h2 {
            margin-bottom: 20px;
        }

        .signup-container input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .signup-button {
            padding: 15px;
            background: red;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
            width: 100%;
        }

        .signup-button:hover {
            background: darkred;
        }

        .login-link {
            margin-top: 10px;
            font-size: 14px;
        }

        .login-link a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loading {
            display: none;
            font-size: 16px;
            color: red;
        }

        .loading::before {
            content: "";
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid red;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="clock" id="clock">00:00:00</div>
    
    <div class="signup-container">
        <h2>Sign Up</h2>
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Password" required>
        <button class="signup-button" id="signupButton">Sign Up</button>
        <p class="loading" id="loading">Signing up...</p>
        <div class="login-link">Already have an account? <a href="login%20Page.html">Login</a></div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAurJx-nSpVdj0ctPx8agoIIVTi8k3Wtpg",
            authDomain: "rersweb.firebaseapp.com",
            databaseURL: "https://rersweb-default-rtdb.firebaseio.com",
            projectId: "rersweb",
            storageBucket: "rersweb.firebasestorage.app",
            messagingSenderId: "432558250053",
            appId: "1:432558250053:web:07fc91665244a2d93feb2c",
            measurementId: "G-WEK79FH0J6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        document.getElementById("signupButton").addEventListener("click", async () => {
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const signupButton = document.getElementById("signupButton");
            const loading = document.getElementById("loading");

            // Enhanced input validation
            if (!name || !email || !password) {
                alert("Please fill in all fields.");
                return;
            }
            if (!/^[a-zA-Z\s]+$/.test(name)) {
                alert("Name should only contain letters and spaces.");
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert("Please enter a valid email address.");
                return;
            }
            if (password.length < 6) {
                alert("Password must be at least 6 characters long.");
                return;
            }

            signupButton.disabled = true;
            loading.style.display = "block";

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Create user profile in Firestore
                await setDoc(doc(db, "users", user.uid), {
                    name: name,
                    email: email,
                    trialStart: new Date(),
                    subscribed: false,
                    createdAt: new Date().toISOString()
                });

                alert("✅ Sign up successful! Your private account has been created.");
                // Removed history.pushState to avoid errors in file:// protocol
                window.location.href = "dashboard.htm";
            } catch (error) {
                // User-friendly error messages
                let errorMessage = "Sign up failed. Please try again.";
                if (error.code === "auth/email-already-in-use") {
                    errorMessage = "This email is already registered. Please use a different email or log in.";
                } else if (error.code === "auth/invalid-email") {
                    errorMessage = "Invalid email format. Please check your email.";
                } else if (error.code === "auth/weak-password") {
                    errorMessage = "Password is too weak. Please use a stronger password.";
                }
                alert(`❌ ${errorMessage}`);
                console.error("Signup error:", error);
            } finally {
                signupButton.disabled = false;
                loading.style.display = "none";
            }
        });

        function updateClock() {
            const clockElement = document.getElementById("clock");
            if (!clockElement) return;

            const now = new Date();
            let hours = now.getHours().toString().padStart(2, "0");
            let minutes = now.getMinutes().toString().padStart(2, "0");
            let seconds = now.getSeconds().toString().padStart(2, "0");

            clockElement.innerText = `${hours}:${minutes}:${seconds}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
