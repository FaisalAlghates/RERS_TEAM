<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Set character encoding to UTF-8 -->
    <meta charset="UTF-8">
    <!-- Ensure responsive viewport scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Page title -->
    <title>Add Building | RERS System</title>
    <!-- Include Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script type="module">
        /* Import Firebase SDK modules */
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

        /* Firebase configuration object */
        const firebaseConfig = {
            apiKey: "AIzaSyAurJx-nSpVdj0ctPx8agoIIVTi8k3Wtpg",
            authDomain: "rersweb.firebaseapp.com",
            projectId: "rersweb",
            storageBucket: "rersweb.firebasestorage.app",
            messagingSenderId: "432558250053",
            appId: "1:432558250053:web:07fc91665244a2d93feb2c"
        };

        /* Initialize Firebase app */
        const app = initializeApp(firebaseConfig);
        /* Initialize Firestore database */
        const db = getFirestore(app);
        /* Initialize Firebase Authentication */
        const auth = getAuth(app);

        /* Function to add a new building */
        window.addBuilding = function () {
            onAuthStateChanged(auth, async (user) => {
                /* Check if user is authenticated */
                if (!user) {
                    alert("You must be logged in to add a building!");
                    return;
                }

                /* Get input values */
                const buildingName = document.getElementById("buildingName").value.trim();
                const location = document.getElementById("location").value.trim();
                const floors = document.getElementById("floors").value;
                const domainNumber = document.getElementById("domainNumber").value.trim();

                /* Validate input fields */
                if (!buildingName || !location || !floors || !domainNumber) {
                    alert("Please fill in all fields!");
                    return;
                }
                /* Validate number of floors */
                if (isNaN(floors) || floors <= 0) {
                    alert("Number of floors must be a positive number!");
                    return;
                }

                try {
                    /* Check if domainNumber already exists */
                    const q = query(collection(db, "buildings"), where("domainNumber", "==", domainNumber));
                    const querySnapshot = await getDocs(q);

                    if (!querySnapshot.empty) {
                        alert("Domain Number already exists! Please choose a unique Domain Number.");
                        return;
                    }

                    /* Construct building data object */
                    const buildingData = {
                        buildingName,
                        location,
                        floors: parseInt(floors),
                        domainNumber,
                        addedBy: user.email,
                        sensors: [],
                        cameras: [],
                        timestamp: new Date().toISOString()
                    };

                    /* Add building to Firestore */
                    await addDoc(collection(db, "buildings"), buildingData);
                    /* Notify user of success and redirect */
                    alert("Building added successfully!");
                    window.location.href = 'add_sensor.html';
                } catch (error) {
                    /* Handle errors during building addition */
                    console.error("Error adding building:", error);
                    alert("Failed to add building. Please try again.");
                }
            });
        };
    </script>

    <style>
