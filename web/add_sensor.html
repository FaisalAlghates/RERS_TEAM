<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Sensor | RERS System</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        :root {
            --primary-color: #ff0000;
            --secondary-color: #00ff00;
            --bg-gradient: radial-gradient(circle, rgba(10, 10, 10, 1) 10%, rgba(0, 0, 0, 1) 80%);
            --sidebar-gradient: linear-gradient(180deg, #2a2a2a, #000);
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: var(--sidebar-gradient);
            padding: 20px;
            position: fixed;
            height: 100vh;
            box-shadow: 4px 0 15px rgba(255, 0, 0, 0.5);
            border-right: 2px solid var(--primary-color);
        }

        .sidebar nav ul {
            list-style: none;
            padding: 0;
        }

        .sidebar nav ul li {
            padding: 15px 0;
            text-align: center;
        }

        .sidebar nav ul li a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            display: block;
            padding: 10px;
            border-radius: 5px;
        }

        .content {
            margin-left: 270px;
            padding: 40px;
            width: calc(100% - 270px);
            text-align: center;
            overflow-y: auto;
        }

        .form-container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: var(--card-shadow);
            text-align: center;
            width: 90%;
            max-width: 800px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .input-group {
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-group input,
        .input-group select {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            outline: none;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-top: 15px;
            width: 100%;
        }

        .primary-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-right: 10px;
        }

        .form-container button {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
            margin-top: 20px;
        }

        .form-container button:hover {
            background: darkred;
        }

        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .button-group button {
            flex: 1;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            outline: none;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }

        .connection-types {
            width: 100%;
            margin: 15px 0;
            text-align: left;
        }

        .connection-type {
            margin-bottom: 10px;
        }

        .connection-type label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .connection-type input {
            margin-right: 10px;
        }

        .connection-details {
            margin-left: 25px;
            margin-top: 5px;
            display: none;
        }

        .connection-details input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            border-radius: 5px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .risk-levels {
            width: 100%;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .risk-level {
            display: flex;
            align-items: center;
            padding: 10px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

        .risk-level input {
            margin-right: 10px;
        }

        .risk-level.low {
            border-left: 4px solid #00ff00;
        }

        .risk-level.medium {
            border-left: 4px solid #ffcc00;
        }

        .risk-level.high {
            border-left: 4px solid #ff0000;
        }

        .risk-description {
            display: none;
            margin-top: 5px;
        }

        .risk-description input {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <nav>
            <ul>
                <li><a href="../web/dashboard.html">dashboard</a></li>
                <li><a href="../web/add_building.html">Add Buildings</a></li>
                <li><a href="../web/monitoring.html">Monitoring</a></li>
                <li><a href="../web/reports.html">Reports</a></li>
                <li><a href="../web/payment.html">Payment</a></li>
                <li><a href="../web/US.html">About Us</a></li>
                <li><a href="../web/logout.html">Logout</a></li>
            </ul>
        </nav>
    </aside>

    <div class="content">
        <div class="form-container">
            <h2>Add New Sensor</h2>

            <div class="input-group">
                <select id="sensorType">
                    <option value="Temperature">Temperature Sensor</option>
                    <option value="Motion">Motion Sensor</option>
                    <option value="Smoke">Smoke Detector</option>
                    <option value="Gas">Gas Sensor</option>
                    <option value="Fire">Fire Alarm Sensor</option>
                    <option value="Flood">Flood Sensor</option>
                    <option value="Sound">Sound Sensor</option>
                    <option value="Vibration">Vibration Sensor</option>
                    <option value="Humidity">Humidity Sensor</option>
                    <option value="Light">Light Sensor</option>
                </select>
            </div>

            <div class="checkbox-wrapper">
                <input type="checkbox" id="hasGps" class="primary-checkbox">
                <label for="hasGps">Built-in GPS in Sensor</label>
            </div>
            <div class="input-group hidden" id="hasGpsFields">
                <select id="gpsBuildingName"></select>
                <select id="gpsFloorNumber"></select>
            </div>
            <div class="checkbox-wrapper">
                <input type="checkbox" id="noGps" class="primary-checkbox">
                <label for="noGps">Does not have built-in GPS</label>
            </div>
            <div class="input-group hidden" id="noGpsFields">
                <input type="text" id="sensorLocation" placeholder="Sensor Location">
                <select id="buildingName"></select>
                <select id="floorNumber"></select>
            </div>

            <div class="connection-types">
                <h3>Connection Types</h3>
                <div class="connection-type">
                    <label><input type="radio" name="connection" value="url"> URL Connection</label>
                    <div class="connection-details" id="urlConnection">
                        <input type="text" placeholder="Enter URL">
                    </div>
                </div>
                <div class="connection-type">
                    <label><input type="radio" name="connection" value="api"> API Connection</label>
                    <div class="connection-details" id="apiConnection">
                        <input type="text" placeholder="API Endpoint">
                        <input type="text" placeholder="API Key">
                    </div>
                </div>
                <div class="connection-type">
                    <label><input type="radio" name="connection" value="mqtt"> MQTT Connection</label>
                    <div class="connection-details" id="mqttConnection">
                        <input type="text" placeholder="MQTT Broker">
                        <input type="text" placeholder="Topic">
                    </div>
                </div>
                <div class="connection-type">
                    <label><input type="radio" name="connection" value="websocket"> WebSocket Connection</label>
                    <div class="connection-details" id="websocketConnection">
                        <input type="text" placeholder="WebSocket URL">
                    </div>
                </div>
            </div>

            <div class="risk-levels">
                <h3>Risk Level Configuration</h3>
                <div class="risk-level low">
                    <input type="checkbox" name="riskLevel" id="riskLow" value="1">
                    <label for="riskLow">Level 1 (Low Risk)</label>
                </div>
                <div class="risk-description" id="descLow">
                    <input type="text" placeholder="Enter description for Low Risk">
                    <input type="number" id="thresholdLow" placeholder="Temperature Threshold (°C)" min="0">
                </div>

                <div class="risk-level medium">
                    <input type="checkbox" name="riskLevel" id="riskMedium" value="2">
                    <label for="riskMedium">Level 2 (Medium Risk)</label>
                </div>
                <div class="risk-description" id="descMedium">
                    <input type="text" placeholder="Enter description for Medium Risk">
                    <input type="number" id="thresholdMedium" placeholder="Temperature Threshold (°C)" min="0">
                </div>

                <div class="risk-level high">
                    <input type="checkbox" name="riskLevel" id="riskHigh" value="3">
                    <label for="riskHigh">Level 3 (High Risk)</label>
                </div>
                <div class="risk-description" id="descHigh">
                    <input type="text" placeholder="Enter description for High Risk">
                    <input type="number" id="thresholdHigh" placeholder="Temperature Threshold (°C)" min="0">
                </div>
            </div>

            <div class="button-group">
                <button onclick="window.location.href='add_building.html'">Previous</button>
                <button onclick="addSensor()">Add Sensor</button>
                <button onclick="window.location.href='add_camera.html'">Next</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, doc, updateDoc, getDoc, getDocs, collection, query, where, arrayUnion } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAurJx-nSpVdj0ctPx8agoIIVTi8k3Wtpg",
            authDomain: "rersweb.firebaseapp.com",
            projectId: "rersweb",
            storageBucket: "rersweb.firebasestorage.app",
            messagingSenderId: "432558250053",
            appId: "1:432558250053:web:07fc91665244a2d93feb2c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const hasGps = document.getElementById('hasGps');
        const noGps = document.getElementById('noGps');
        const hasGpsFields = document.getElementById('hasGpsFields');
        const noGpsFields = document.getElementById('noGpsFields');

        // Connection type toggles
        const connectionRadios = document.querySelectorAll('input[name="connection"]');
        connectionRadios.forEach(radio => {
            radio.addEventListener('change', function () {
                document.querySelectorAll('.connection-details').forEach(details => {
                    details.style.display = 'none';
                });
                const detailsDiv = document.getElementById(this.value + "Connection");
                if (this.checked) {
                    detailsDiv.style.display = 'block';
                }
            });
        });

        // Risk level description toggles
        const riskCheckboxes = document.querySelectorAll('input[name="riskLevel"]');
        riskCheckboxes.forEach(checkbox => {
            checkbox.addEventListener('change', function () {
                const descDiv = document.getElementById(`desc${this.id.replace('risk', '')}`);
                descDiv.style.display = this.checked ? 'block' : 'none';
            });
        });

        hasGps.addEventListener('change', function () {
            if (this.checked) {
                noGps.checked = false;
                noGpsFields.classList.add('hidden');
                hasGpsFields.classList.remove('hidden');
            } else {
                hasGpsFields.classList.add('hidden');
            }
        });

        noGps.addEventListener('change', function () {
            if (this.checked) {
                hasGps.checked = false;
                noGpsFields.classList.remove('hidden');
                hasGpsFields.classList.add('hidden');
            } else {
                noGpsFields.classList.add('hidden');
            }
        });

        async function populateBuildingData() {
            try {
                const user = auth.currentUser;
                if (!user) {
                    console.log("User not authenticated");
                    return;
                }

                const buildingSelect = document.getElementById('buildingName');
                const floorSelect = document.getElementById('floorNumber');
                const gpsBuildingSelect = document.getElementById('gpsBuildingName');
                const gpsFloorSelect = document.getElementById('gpsFloorNumber');
                buildingSelect.innerHTML = '<option value="">Select a Building</option>';
                gpsBuildingSelect.innerHTML = '<option value="">Select a Building</option>';

                const q = query(collection(db, "buildings"), where("addedBy", "==", user.email));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const option = document.createElement('option');
                    option.value = doc.id;
                    option.text = data.buildingName;
                    buildingSelect.appendChild(option);
                    gpsBuildingSelect.appendChild(option.cloneNode(true));
                });

                buildingSelect.addEventListener('change', async function () {
                    const selectedBuildingId = this.value;
                    floorSelect.innerHTML = '<option value="">Select a Floor</option>';
                    if (selectedBuildingId) {
                        const buildingRef = doc(db, "buildings", selectedBuildingId);
                        const buildingSnap = await getDoc(buildingRef);
                        if (buildingSnap.exists()) {
                            const data = buildingSnap.data();
                            for (let i = 1; i <= parseInt(data.floors); i++) {
                                floorSelect.innerHTML += `<option value="${i}">Floor ${i}</option>`;
                            }
                        }
                    }
                });

                gpsBuildingSelect.addEventListener('change', async function () {
                    const selectedBuildingId = this.value;
                    gpsFloorSelect.innerHTML = '<option value="">Select a Floor</option>';
                    if (selectedBuildingId) {
                        const buildingRef = doc(db, "buildings", selectedBuildingId);
                        const buildingSnap = await getDoc(buildingRef);
                        if (buildingSnap.exists()) {
                            const data = buildingSnap.data();
                            for (let i = 1; i <= parseInt(data.floors); i++) {
                                gpsFloorSelect.innerHTML += `<option value="${i}">Floor ${i}</option>`;
                            }
                        }
                    }
                });

                console.log("Buildings fetched:", querySnapshot.docs.map(doc => doc.data()));
            } catch (error) {
                console.error("Error fetching buildings:", error);
            }
        }

        window.addSensor = function () {
            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    alert("You must be logged in to add a sensor!");
                    return;
                }

                let buildingId;
                if (hasGps.checked) {
                    buildingId = document.getElementById("gpsBuildingName").value;
                } else if (noGps.checked) {
                    buildingId = document.getElementById("buildingName").value;
                }
                if (!buildingId) {
                    alert("No building selected. Please select a building.");
                    return;
                }

                const sensorType = document.getElementById("sensorType").value;
                const selectedRisks = document.querySelectorAll('input[name="riskLevel"]:checked');
                if (selectedRisks.length === 0) {
                    alert("Please select at least one risk level!");
                    return;
                }
                const riskLevels = Array.from(selectedRisks).map(risk => {
                    const levelId = risk.id.replace('risk', '');
                    const thresholdInput = document.getElementById(`threshold${levelId}`);
                    return {
                        level: parseInt(risk.value),
                        description: document.getElementById(`desc${levelId}`).querySelector('input[type="text"]').value,
                        threshold: thresholdInput && sensorType === "Temperature" ? parseFloat(thresholdInput.value) : null
                    };
                });

                const connections = {};
                connectionRadios.forEach(radio => {
                    if (radio.checked) {
                        const detailsDiv = document.getElementById(radio.value + "Connection");
                        const inputs = detailsDiv.querySelectorAll('input');
                        connections[radio.value] = Array.from(inputs).map(input => input.value);
                    }
                });

                if (noGps.checked && !document.getElementById("sensorLocation").value.trim()) {
                    alert("Please enter a sensor location!");
                    return;
                }

                try {
                    const buildingRef = doc(db, "buildings", buildingId);
                    const buildingSnap = await getDoc(buildingRef);
                    if (!buildingSnap.exists()) {
                        alert("Selected building does not exist.");
                        return;
                    }
                    const buildingData = buildingSnap.data();

                    const sensorData = {
                        type: sensorType,
                        riskLevels: riskLevels,
                        isPrimary: true,
                        connections,
                        status: "inactive",
                        uniqueId: `${buildingId}-${sensorType}-${Date.now()}`,
                        addedBy: user.email,
                        timestamp: new Date().toISOString(),
                        source: sensorType === "Temperature" ? "house/temp" : null // Link to Realtime Database
                    };

                    if (hasGps.checked) {
                        sensorData.hasGps = true;
                        sensorData.buildingName = buildingData.buildingName;
                        sensorData.floor = document.getElementById("gpsFloorNumber").value;
                    } else if (noGps.checked) {
                        sensorData.hasGps = false;
                        sensorData.location = document.getElementById("sensorLocation").value.trim();
                        sensorData.buildingName = buildingData.buildingName;
                        sensorData.floor = document.getElementById("floorNumber").value;
                    }

                    await updateDoc(buildingRef, {
                        sensors: arrayUnion(sensorData)
                    });

                    alert(`${sensorType} sensor added successfully!`);
                    window.location.href = 'monitoring.html';
                } catch (error) {
                    console.error("Error adding sensor:", error);
                    alert("Failed to add sensor. Please try again.");
                }
            });
        };

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = '../web/loginPage.html';
            } else {
                populateBuildingData();
            }
        });
    </script>

</body>
