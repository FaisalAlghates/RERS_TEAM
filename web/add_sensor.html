<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Sensor | RERS System</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, rgba(10, 10, 10, 1) 10%, rgba(0, 0, 0, 1) 80%);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #2a2a2a, #000);
            padding: 20px;
            position: fixed;
            height: 100vh;
            box-shadow: 4px 0 15px rgba(255, 0, 0, 0.5);
            border-right: 2px solid #ff0000;
        }
        .sidebar nav ul {
            list-style: none;
            padding: 0;
        }
        .sidebar nav ul li {
            padding: 15px 0;
            text-align: center;
        }
        .sidebar nav ul li a {
            color: #ff0000;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            display: block;
            padding: 10px;
            border-radius: 5px;
        }
        .content {
            margin-left: 270px;
            padding: 40px;
            width: calc(100% - 270px);
            text-align: center;
            overflow-y: auto;
        }
        .form-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            text-align: center;
            width: 90%;
            max-width: 800px;
            margin: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .input-group {
            width: 100%;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 10px;
        }
        .input-group input, .input-group select {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            outline: none;
        }
        .checkbox-wrapper {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-top: 15px;
        }
        .primary-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-right: 10px;
        }
        .form-container button {
            width: 100%;
            padding: 15px;
            background: red;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.3s;
            margin-top: 20px;
        }
        .form-container button:hover {
            background: darkred;
        }
        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            outline: none;
            cursor: pointer;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <nav>
            <ul>
                <li><a href="../web/dashboard.htm">dashboard</a></li>
                <li><a href="..//web/add_building.htm">Add Buildings</a></li>
                <li><a href="../web/monitoring.html">Monitoring</a></li>
                <li><a href="../web/reports.html">Reports</a></li>
                <li><a href="../web/payment .htm">Payment</a></li>
                <li><a href="../web/US.htm">About Us</a></li>
                <li><a href="../web/logout.htm">Logout</a></li>
            </ul>
        </nav>
    </aside>

    <div class="content">
        <div class="form-container">
            <h2>Add New Sensor</h2>
            <div class="input-group">
                <select id="sensorType">
                    <option value="Temperature">Temperature Sensor</option>
                    <option value="Motion">Motion Sensor</option>
                    <option value="Smoke">Smoke Detector</option>
                    <option value="Gas">Gas Sensor</option>
                    <option value="Fire">Fire Alarm Sensor</option>
                    <option value="Flood">Flood Sensor</option>
                    <option value="Sound">Sound Sensor</option>
                    <option value="Vibration">Vibration Sensor</option>
                    <option value="Humidity">Humidity Sensor</option>
                    <option value="Light">Light Sensor</option>
                </select>
            </div>
            <div class="checkbox-wrapper">
                <input type="checkbox" id="hasGps" class="primary-checkbox">
                <label for="hasGps">Built-in GPS in Sensor</label>
            </div>
            <div class="checkbox-wrapper">
                <input type="checkbox" id="noGps" class="primary-checkbox">
                <label for="noGps">Does not have built-in GPS</label>
            </div>
            <div class="input-group hidden" id="riskLevelGroup">
                <input type="number" id="riskLevel" placeholder="Risk Level (1-5)">
            </div>
            <div class="input-group hidden" id="noGpsFields">
                <input type="text" id="sensorLocation" placeholder="Sensor Location">
                <select id="buildingName"></select>
                <select id="floorNumber"></select>
            </div>
            <div class="checkbox-wrapper">
                <input type="checkbox" id="primarySensor" class="primary-checkbox">
                <label for="primarySensor">Mark as Primary Sensor</label>
            </div>
            <button onclick="addSensor()">Next: Add Cameras</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, doc, updateDoc, getDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
    
        const firebaseConfig = {
            apiKey: "AIzaSyAurJx-nSpVdj0ctPx8agoIIVTi8k3Wtpg",
            authDomain: "rersweb.firebaseapp.com",
            projectId: "rersweb",
            storageBucket: "rersweb.firebasestorage.app",
            messagingSenderId: "432558250053",
            appId: "1:432558250053:web:07fc91665244a2d93feb2c"
        };
    
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
    
        const hasGps = document.getElementById('hasGps');
        const noGps = document.getElementById('noGps');
        const riskLevelGroup = document.getElementById('riskLevelGroup');
        const noGpsFields = document.getElementById('noGpsFields');
    
        hasGps.addEventListener('change', function() {
            if (this.checked) {
                noGps.checked = false;
                riskLevelGroup.classList.remove('hidden');
                noGpsFields.classList.add('hidden');
            } else if (!noGps.checked) {
                riskLevelGroup.classList.add('hidden');
            }
        });
    
        noGps.addEventListener('change', function() {
            if (this.checked) {
                hasGps.checked = false;
                noGpsFields.classList.remove('hidden');
                riskLevelGroup.classList.remove('hidden');
            } else if (!hasGps.checked) {
                noGpsFields.classList.add('hidden');
                riskLevelGroup.classList.add('hidden');
            }
        });
    
        async function populateBuildingData() {
            const buildingId = localStorage.getItem('currentBuildingId');
            if (buildingId) {
                const buildingRef = doc(db, "buildings", buildingId);
                const buildingSnap = await getDoc(buildingRef);
                if (buildingSnap.exists()) {
                    const data = buildingSnap.data();
                    const buildingSelect = document.getElementById('buildingName');
                    const floorSelect = document.getElementById('floorNumber');
                    
                    buildingSelect.innerHTML = `<option value="${data.buildingName}">${data.buildingName}</option>`;
                    
                    floorSelect.innerHTML = '';
                    for (let i = 1; i <= parseInt(data.floors); i++) {
                        floorSelect.innerHTML += `<option value="${i}">Floor ${i}</option>`;
                    }
                }
            }
        }
    
        window.addSensor = function() {
            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    alert("You must be logged in to add a sensor!");
                    return;
                }
    
                const buildingId = localStorage.getItem('currentBuildingId');
                if (!buildingId) {
                    alert("No building selected. Please add a building first.");
                    window.location.href = 'add_building.htm';
                    return;
                }
    
                const sensorType = document.getElementById("sensorType").value;
                const riskLevel = document.getElementById("riskLevel").value;
                const isPrimary = document.getElementById("primarySensor").checked;
    
                if ((hasGps.checked || noGps.checked) && !riskLevel) {
                    alert("Please enter a risk level (1-5)!");
                    return;
                }
                if (noGps.checked && !document.getElementById("sensorLocation").value.trim()) {
                    alert("Please enter a sensor location!");
                    return;
                }
    
                const sensorData = {
                    type: sensorType,
                    riskLevel: riskLevel ? parseInt(riskLevel) : null,
                    isPrimary
                };
    
                if (hasGps.checked) {
                    sensorData.hasGps = true;
                } else if (noGps.checked) {
                    sensorData.hasGps = false;
                    sensorData.location = document.getElementById("sensorLocation").value.trim();
                    sensorData.buildingName = document.getElementById("buildingName").value;
                    sensorData.floor = document.getElementById("floorNumber").value;
                }
    
                try {
                    const buildingRef = doc(db, "buildings", buildingId);
                    await updateDoc(buildingRef, {
                        sensors: arrayUnion(sensorData)
                    });
                    alert("Sensor added successfully!");
                    window.location.href = 'add_camera.html';
                } catch (error) {
                    console.error("Error adding sensor:", error);
                    alert("Failed to add sensor. Please try again.");
                }
            });
        }
    
        populateBuildingData();
    </script>
</body>
</html>
