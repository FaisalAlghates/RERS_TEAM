<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Add new sensors to a building in the RERS System.">
    <title>Add Sensors | RERS System</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, doc, updateDoc, getDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAurJx-nSpVdj0ctPx8agoIIVTi8k3Wtpg",
            authDomain: "rersweb.firebaseapp.com",
            projectId: "rersweb",
            storageBucket: "rersweb.firebasestorage.app",
            messagingSenderId: "432558250053",
            appId: "1:432558250053:web:07fc91665244a2d93feb2c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        function addSensorRow() {
            const container = document.getElementById('sensorRows');
            const row = document.createElement('div');
            row.className = 'sensor-row';
            row.innerHTML = `
                <div class="input-group">
                    <label for="sensor-type-${Date.now()}">Sensor Type</label>
                    <select class="sensor-type" id="sensor-type-${Date.now()}" aria-label="Sensor Type">
                        <option value="Temperature">Temperature</option>
                        <option value="Motion">Motion</option>
                        <option value="Smoke">Smoke</option>
                        <option value="Gas">Gas</option>
                        <option value="Fire">Fire</option>
                        <option value="Flood">Flood</option>
                        <option value="Sound">Sound</option>
                        <option value="Vibration">Vibration</option>
                        <option value="Humidity">Humidity</option>
                        <option value="Light">Light</option>
                        <option value="Air Quality">Air Quality</option>
                        <option value="Pressure">Pressure</option>
                        <option value="Proximity">Proximity</option>
                        <option value="CO2">CO2</option>
                        <option value="Radiation">Radiation</option>
                        <option value="Tilt">Tilt</option>
                        <option value="Strain">Strain</option>
                        <option value="Leak">Leak</option>
                        <option value="Voltage">Voltage</option>
                        <option value="Current">Current</option>
                        <option value="Flow">Flow</option>
                        <option value="Wind Speed">Wind Speed</option>
                        <option value="Dust">Dust</option>
                        <option value="UV">UV</option>
                        <option value="Infrared">Infrared</option>
                        <option value="pH">pH</option>
                        <option value="Soil Moisture">Soil Moisture</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="connection-type-${Date.now()}">Connection Type</label>
                    <select class="connection-type" id="connection-type-${Date.now()}" aria-label="Connection Type">
                        <option value="URL">URL (API)</option>
                        <option value="Bluetooth">Bluetooth</option>
                        <option value="WiFi">Wi-Fi</option>
                        <option value="Zigbee">Zigbee</option>
                        <option value="LoRa">LoRa</option>
                        <option value="Ethernet">Ethernet</option>
                        <option value="Z-Wave">Z-Wave</option>
                        <option value="Cellular">Cellular (4G/5G)</option>
                        <option value="NB-IoT">NB-IoT</option>
                        <option value="Sigfox">Sigfox</option>
                        <option value="RS-485">RS-485</option>
                        <option value="Modbus">Modbus</option>
                        <option value="CAN Bus">CAN Bus</option>
                        <option value="USB">USB</option>
                        <option value="Serial">Serial</option>
                        <option value="MQTT">MQTT</option>
                        <option value="CoAP">CoAP</option>
                        <option value="Thread">Thread</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="connection-value-${Date.now()}">Connection Value</label>
                    <input type="text" class="connection-value" id="connection-value-${Date.now()}" placeholder="e.g., URL, IP, or device ID" aria-required="true">
                </div>
                <div class="input-group">
                    <label for="risk-level-${Date.now()}">Risk Level (1-3)</label>
                    <input type="number" class="risk-level" id="risk-level-${Date.now()}" min="1" max="3" placeholder="1-3" aria-required="true">
                </div>
                <div class="input-group">
                    <label for="unique-id-${Date.now()}">Unique ID</label>
                    <input type="text" class="unique-id" id="unique-id-${Date.now()}" placeholder="Unique sensor ID" aria-required="true">
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" class="primary-sensor" id="primary-sensor-${Date.now()}" aria-label="Mark as Primary Sensor">
                    <label for="primary-sensor-${Date.now()}">Primary</label>
                </div>
                <button type="button" class="remove-row" onclick="this.parentElement.remove()" aria-label="Remove Sensor Row">Remove</button>
            `;
            container.appendChild(row);
        }

        async function populateBuildingData() {
            const buildingId = localStorage.getItem('currentBuildingId');
            if (buildingId) {
                const buildingRef = doc(db, "buildings", buildingId);
                const buildingSnap = await getDoc(buildingRef);
                if (buildingSnap.exists()) {
                    const data = buildingSnap.data();
                    const buildingSelect = document.getElementById('buildingName');
                    const floorSelect = document.getElementById('floorNumber');
                    buildingSelect.innerHTML = `<option value="${data.buildingName}">${data.buildingName}</option>`;
                    floorSelect.innerHTML = '<option value="">Select Floor</option>';
                    for (let i = 1; i <= parseInt(data.floors); i++) {
                        floorSelect.innerHTML += `<option value="${i}">Floor ${i}</option>`;
                    }
                }
            }
        }

        window.addSensor = async function() {
            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    alert("You must be logged in to add sensors!");
                    window.location.href = 'login.htm';
                    return;
                }

                const buildingId = localStorage.getItem('currentBuildingId');
                if (!buildingId) {
                    alert("No building selected. Please add a building first.");
                    window.location.href = 'add_building.htm';
                    return;
                }

                const sensorRows = document.querySelectorAll('.sensor-row');
                const sensors = [];
                for (const row of sensorRows) {
                    const sensorType = row.querySelector('.sensor-type').value;
                    const connectionType = row.querySelector('.connection-type').value;
                    const connectionValue = row.querySelector('.connection-value').value.trim();
                    const riskLevel = parseInt(row.querySelector('.risk-level').value);
                    const uniqueId = row.querySelector('.unique-id').value.trim();
                    const isPrimary = row.querySelector('.primary-sensor').checked;

                    // Validation
                    if (!connectionValue || !uniqueId || isNaN(riskLevel) || riskLevel < 1 || riskLevel > 3) {
                        alert("Please fill all fields correctly for each sensor!");
                        return;
                    }
                    if (connectionType === 'URL' && !/^https?:\/\//i.test(connectionValue)) {
                        alert("For URL connection, please enter a valid URL starting with http:// or https://");
                        return;
                    }

                    sensors.push({
                        type: sensorType,
                        connectionType,
                        connectionValue,
                        riskLevel,
                        uniqueId,
                        isPrimary,
                        hasGps: document.getElementById('hasGps').checked,
                        location: document.getElementById('sensorLocation').value.trim(),
                        buildingName: document.getElementById('buildingName').value,
                        floor: document.getElementById('floorNumber').value,
                        zone: document.getElementById('zoneNumber').value.trim(),
                        status: 'inactive',
                        activated: false,
                        addedBy: user.email,
                        timestamp: new Date().toISOString()
                    });
                }

                if (sensors.length === 0) {
                    alert("Please add at least one sensor!");
                    return;
                }

                try {
                    const buildingRef = doc(db, "buildings", buildingId);
                    for (const sensor of sensors) {
                        await updateDoc(buildingRef, { sensors: arrayUnion(sensor) });
                    }
                    alert("Sensors added successfully!");
                    window.location.href = 'add_camera.html';
                } catch (error) {
                    console.error("Error adding sensors:", error);
                    alert("Failed to add sensors. Please try again.");
                }
            });
        };

        document.getElementById('addSensorRow').addEventListener('click', addSensorRow);
        window.onload = populateBuildingData;
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        :root {
            --primary-red: #ff0000;
            --dark-bg: #1a1a1a;
            --black: #000;
            --white-alpha: rgba(255, 255, 255, 0.1);
            --shadow-red: rgba(255, 0, 0, 0.7);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle, var(--dark-bg) 10%, var(--black) 80%);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            min-height: 100vh;
            perspective: 1000px;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #2a2a2a, var(--black));
            padding: 20px;
            position: fixed;
            top: 0;
            bottom: 0;
            box-shadow: 5px 0 20px var(--shadow-red);
            border-right: 2px solid var(--primary-red);
            transform: translateZ(20px);
            transition: var(--transition);
            z-index: 1000;
        }

        .sidebar:hover {
            transform: translateZ(30px);
        }

        .sidebar nav ul {
            list-style: none;
        }

        .sidebar nav ul li {
            margin: 10px 0;
        }

        .sidebar nav ul li a {
            color: var(--primary-red);
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
            display: block;
            padding: 12px;
            border-radius: 8px;
            transition: var(--transition);
        }

        .sidebar nav ul li a:hover,
        .sidebar nav ul li a:focus {
            background: rgba(255, 0, 0, 0.3);
            transform: translateZ(10px);
            outline: none;
        }

        .content {
            margin-left: 250px;
            padding: 30px;
            width: calc(100% - 250px);
            overflow-y: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .form-container {
            background: var(--white-alpha);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 25px var(--shadow-red);
            max-width: 800px;
            width: 100%;
            transform: translateZ(20px);
            transition: var(--transition);
        }

        .form-container:hover {
            transform: translateZ(30px);
        }

        .form-container h2 {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            text-shadow: 0 0 8px var(--primary-red);
            margin-bottom: 20px;
        }

        .sensor-rows {
            margin-bottom: 20px;
        }

        .sensor-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .input-group {
            flex: 1;
            min-width: 150px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 6px;
            border: none;
            background: var(--white-alpha);
            color: #fff;
            font-size: 14px;
            font-family: 'Orbitron', sans-serif;
            transition: var(--transition);
        }

        .input-group input:hover,
        .input-group select:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .input-group input:focus,
        .input-group select:focus {
            background: rgba(255, 255, 255, 0.2);
            outline: 2px solid var(--primary-red);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 5px;
            min-width: 100px;
            padding: 10px;
        }

        .checkbox-group input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-group label {
            font-size: 14px;
            font-weight: 700;
        }

        .remove-row {
            padding: 8px 12px;
            background: #cc0000;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition);
        }

        .remove-row:hover,
        .remove-row:focus {
            background: #990000;
            outline: none;
        }

        .form-container button:not(.remove-row) {
            width: 100%;
            padding: 12px;
            background: var(--primary-red);
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
            transform: translateZ(0);
            margin-top: 10px;
        }

        .form-container button:not(.remove-row):hover,
        .form-container button:not(.remove-row):focus {
            background: #cc0000;
            transform: translateZ(10px);
            outline: none;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                border-right: none;
                border-bottom: 2px solid var(--primary-red);
                box-shadow: none;
            }

            .content {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }

            .form-container {
                padding: 15px;
            }

            .sensor-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar" role="navigation" aria-label="Main Navigation">
        <nav>
            <ul>
                <li><a href="dashboard.htm" aria-label="Go to Dashboard">Dashboard</a></li>
                <li><a href="add_building.htm" aria-label="Add New Buildings">Add Buildings</a></li>
                <li><a href="monitoring.html" aria-label="View Monitoring Dashboard">Monitoring</a></li>
                <li><a href="reports.html" aria-label="View Reports">Reports</a></li>
                <li><a href="payment.htm" aria-label="Manage Payments">Payment</a></li>
                <li><a href="about.htm" aria-label="About Us">About Us</a></li>
                <li><a href="logout.htm" aria-label="Log Out">Logout</a></li>
            </ul>
        </nav>
    </aside>

    <main class="content" role="main">
        <section class="form-container" aria-label="Add New Sensors">
            <h2>Add New Sensors</h2>
            <form>
                <button type="button" id="addSensorRow" aria-label="Add New Sensor Row">Add Sensor</button>
                <div class="sensor-rows" id="sensorRows"></div>
                <div class="input-group">
                    <label for="sensorLocation">Sensor Location</label>
                    <input type="text" id="sensorLocation" placeholder="Enter sensor location" aria-required="true">
                </div>
                <div class="input-group">
                    <label for="buildingName">Building Name</label>
                    <select id="buildingName" aria-label="Select Building" disabled></select>
                </div>
                <div class="input-group">
                    <label for="floorNumber">Floor Number</label>
                    <select id="floorNumber" aria-label="Select Floor" aria-required="true"></select>
                </div>
                <div class="input-group">
                    <label for="zoneNumber">Zone Number</label>
                    <input type="text" id="zoneNumber" placeholder="Enter zone number" aria-required="true">
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="hasGps" aria-label="Sensor has Built-in GPS">
                    <label for="hasGps">Built-in GPS</label>
                </div>
                <button type="button" onclick="addSensor()" aria-label="Proceed to Add Cameras">Next: Add Cameras</button>
            </form>
        </section>
    </main>
</body>
</html>
