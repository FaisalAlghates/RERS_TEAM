<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Building | RERS System</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAurJx-nSpVdj0ctPx8agoIIVTi8k3Wtpg",
            authDomain: "rersweb.firebaseapp.com",
            projectId: "rersweb",
            storageBucket: "rersweb.firebasestorage.app",
            messagingSenderId: "432558250053",
            appId: "1:432558250053:web:07fc91665244a2d93feb2c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        window.addBuilding = function () {
            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    alert("You must be logged in to add a building!");
                    return;
                }

                const buildingName = document.getElementById("buildingName").value.trim();
                const location = document.getElementById("location").value.trim();
                const floors = document.getElementById("floors").value;
                const domainNumber = document.getElementById("domainNumber").value.trim();

                if (!buildingName || !location || !floors || !domainNumber) {
                    alert("Please fill in all fields!");
                    return;
                }
                if (isNaN(floors) || floors <= 0) {
                    alert("Number of floors must be a positive number!");
                    return;
                }

                const buildingData = {
                    buildingName,
                    location,
                    floors: parseInt(floors),
                    domainNumber,
                    addedBy: user.email,
                    sensors: [],
                    cameras: [],
                    timestamp: new Date().toISOString()
                };

                try {
                    await addDoc(collection(db, "buildings"), buildingData);
                    alert("Building added successfully!");
                    window.location.href = 'add_sensor.html';
                } catch (error) {
                    console.error("Error adding building:", error);
                    alert("Failed to add building. Please try again.");
                }
            });
        };
    </script>

            --primary-color: #ff0000;

            --bg-gradient: radial-gradient(circle, rgba(10, 10, 10, 1) 10%, rgba(0, 0, 0, 1) 80%);

        }

        .form-container {

            border-radius: 12px;
            box-shadow: var(--card-shadow);
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        .form-container h2 {
            font-size: 24px;
            text-shadow: 0 0 10px var(--primary-color);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 14px;
            transition: background 0.3s;
        }

        .input-group input:hover,
        .input-group input:focus {
            background: rgba(255, 255, 255, 0.2);
            outline: none;
        }

        .button-group {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .button-group button {
            flex: 1;
            padding: 12px;
            background: var(--primary-color);
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .button-group button:hover {
            background: #cc0000;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                position: static;
                border-right: none;
                border-bottom: 2px solid var(--primary-color);
                box-shadow: none;
            }

            .content {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }

            .form-container {
                padding: 15px;
            }
        }
    </style>
</head>

    <div class="content">

            <h2>Add New Building</h2>
            <div class="input-group">
                <input type="text" id="buildingName" placeholder="Building Name">
            </div>
            <div class="input-group">
                <input type="text" id="location" placeholder="Location">
            </div>
            <div class="input-group">
                <input type="number" id="floors" placeholder="Number of Floors" min="1">
            </div>
            <div class="input-group">
                <input type="text" id="domainNumber" placeholder="Domain Number">
            </div>
            <div class="button-group">
                <button onclick="addBuilding()">Add Building</button>
                <button onclick="window.location.href='add_sensor.html'">Next</button>
            </div>
        </div>
    </div>
