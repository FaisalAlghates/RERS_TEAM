<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Set character encoding to UTF-8 -->
    <meta charset="UTF-8">
    <!-- Ensure responsive viewport scaling -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Page title -->
    <title>Monitoring | RERS System</title>
    <!-- Include Font Awesome for icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <script type="module">
        /* Import Firebase SDK modules */
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, getDoc, query, where, updateDoc, addDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-database.js";

        /* Firebase configuration object */
        const firebaseConfig = {
            apiKey: "AIzaSyAurJx-nSpVdj0ctPx8agoIIVTi8k3Wtpg",
            authDomain: "rersweb.firebaseapp.com",
            projectId: "rersweb",
            storageBucket: "rersweb.firebasestorage.app",
            messagingSenderId: "432558250053",
            appId: "1:432558250053:web:07fc91665244a2d93feb2c"
        };

        /* Initialize Firebase app */
        const app = initializeApp(firebaseConfig);
        /* Initialize Firestore database */
        const db = getFirestore(app);
        /* Initialize Firebase Realtime Database */
        const rtdb = getDatabase(app);
        /* Initialize Firebase Authentication */
        const auth = getAuth(app);

        /* Set to track notified sensors */
        const notifiedSensors = new Set();
        /* Variable to store heat sensor data */
        let heatSensorData = null;
        /* Track the last notification timestamp */
        let lastNotificationTime = 0; // Track the last notification timestamp
        /* Delay between notifications in milliseconds */
        const NOTIFICATION_DELAY = 3000; // 3 seconds delay between notifications

        /* Function to convert YouTube URL to embed format */
        function convertToEmbedUrl(url) {
            if (!url) return null;
            if (url.includes('youtube.com/embed/')) return url;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            const videoId = (match && match[2].length === 11) ? match[2] : null;
            return videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=1` : url;
        }

        /* Function to validate URLs */
        const isValidURL = (url) => {
            try {
                new URL(url);
                return url.startsWith("https://") || url.startsWith("http://") ||
                    url.startsWith("rtsp://") || url.startsWith("ws://") ||
                    url.startsWith("wss://");
            } catch {
                return false;
            }
        };

        /* Function to notify relevant parties about sensor alerts */
        function notifyParty(sensor, building) {
            const sensorId = sensor.uniqueId || `${sensor.type}-${sensor.location || 'unknown'}`;
            if (notifiedSensors.has(sensorId)) return;

            /* Get contact information from building data */
            const contacts = building.contacts || {};
            const contactEmail = contacts.email || "admin@example.com";
            const contactPhone = contacts.phone || "+1234567890";
            /* Determine the highest risk level */
            const highestRiskLevel = sensor.riskLevels && sensor.riskLevels.length > 0
                ? Math.max(...sensor.riskLevels.map(r => r.level))
                : 1;

            /* Set default notification method */
            let notificationMethod = "Email";
            /* Construct notification message */
            let notificationMessage = `Sensor Alert: ${sensor.type} at ${sensor.location || building.location || "Unknown"} (Building: ${building.buildingName || "N/A"}) - Highest Risk Level: ${highestRiskLevel}`;

            /* Adjust notification method and message based on risk level */
            if (highestRiskLevel >= 3) {
                notificationMethod = "Email and SMS (High Priority)";
                notificationMessage += " - Immediate action required!";
            } else if (highestRiskLevel === 2) {
                notificationMethod = "Email (Medium Priority)";
                notificationMessage += " - Please review.";
            } else {
                notificationMethod = "Email (Low Priority)";
                notificationMessage += " - For your information.";
            }

            /* Log notification details */
            console.log(`Notifying party via ${notificationMethod} to ${contactEmail}${contactPhone ? ` and ${contactPhone}` : ''}: ${notificationMessage}`);
            /* Add sensor to notified set */
            notifiedSensors.add(sensorId);
        }

        /* Function to load and display cameras */
        function loadCameras(userEmail, displayMode) {
            /* Get camera grid container and header */
            const container = document.getElementById("cameraGrid");
            const cameraHeader = document.getElementById("cameraHeader");
            /* Hide cameras if in sensors-only mode */
            if (displayMode === "sensors") {
                container.style.display = "none";
                return;
            }
            /* Show camera grid */
            container.style.display = "grid";
            /* Display loading message */
            container.innerHTML = '<p class="loading">Loading Cameras...</p>';

            /* Query buildings added by the user */
            const q = query(collection(db, "buildings"), where("addedBy", "==", userEmail));
            /* Listen for real-time updates */
            onSnapshot(q, (snapshot) => {
                let camerasHTML = "";
                let cameraCount = 0;

                snapshot.forEach((doc) => {
                    const building = doc.data();
                    /* Check if building has cameras */
                    if (building.cameras && Array.isArray(building.cameras)) {
                        building.cameras.forEach((camera) => {
                            /* Limit cameras in non-camera mode */
                            if (displayMode !== "cameras" && cameraCount >= 6) return;
                            /* Determine connection type */
                            const connectionType = camera.connections && Object.keys(camera.connections).length > 0
                                ? Object.keys(camera.connections)[0] : "N/A";
                            /* Get camera URL */
                            const cameraUrl = camera.connections && camera.connections[connectionType] && camera.connections[connectionType][0]
                                ? camera.connections[connectionType][0]
                                : camera.url;

                            /* Validate and format URL */
                            if (isValidURL(cameraUrl)) {
                                const displayUrl = (cameraUrl.includes('youtube.com') || cameraUrl.includes('youtu.be'))
                                    ? convertToEmbedUrl(cameraUrl)
                                    : cameraUrl;

                                /* Add camera HTML */
                                camerasHTML += `
                                    <div class="camera-feed">
                                        <h4>${camera.location || building.location || "Unknown"}</h4>
                                        <iframe src="${displayUrl}" width="100%" height="250px" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                                        <p>Unique ID: ${camera.uniqueId || "N/A"} | Connection: ${connectionType}</p>
                                    </div>`;
                                cameraCount++;
                            }
                        });
                    }
                });

                /* Update camera header with count */
                cameraHeader.textContent = `Cameras (${displayMode === "cameras" ? cameraCount : 6})`;

                /* Add placeholders if needed */
                if (displayMode !== "cameras") {
                    while (cameraCount < 6) {
                        camerasHTML += `
                            <div class="camera-feed">
                                <h4>Camera ${cameraCount + 1}</h4>
                                <div class="placeholder">No Camera Assigned</div>
                            </div>`;
                        cameraCount++;
                    }
                }

                /* Update container with camera HTML or fallback message */
                container.innerHTML = camerasHTML || "<p>No cameras available</p>";
            }, (error) => {
                /* Handle errors during camera loading */
                console.error("Error loading cameras:", error);
                container.innerHTML = `<p>Error loading cameras: ${error.message}</p>`;
            });
        }

        /* Function to log temperature exceedance events */
        function logExceedanceEvent(sensor, building, tempValue, userEmail) {
            /* Construct report data */
            const reportData = {
                type: "daily",
                details: `Temperature Exceedance: ${tempValue}°C detected by ${sensor.type} sensor at ${sensor.location || building.location || "Unknown"} (Building: ${sensor.buildingName || building.buildingName || "N/A"})`,
                sensorInfo: {
                    type: sensor.type,
                    location: sensor.location || building.location || "Unknown",
                    buildingName: sensor.buildingName || building.buildingName || "N/A",
                    floor: sensor.floor || "N/A",
                    uniqueId: sensor.uniqueId || "N/A",
                    temperature: tempValue,
                    addedBy: userEmail
                },
                timestamp: new Date().toISOString()
            };

            /* Add report to Firestore */
            addDoc(collection(db, "reports"), reportData)
                .then(() => console.log("Exceedance event logged"))
                .catch(error => console.error("Error logging exceedance event:", error));
        }

        /* Function to display emergency modal for alerts */
        function showEmergencyModal(sensor, building, tempValue, triggeredRiskLevel, riskDescription) {
            const currentTime = Date.now();
            /* Enforce notification delay */
            if (currentTime - lastNotificationTime < NOTIFICATION_DELAY) {
                setTimeout(() => {
                    showEmergencyModal(sensor, building, tempValue, triggeredRiskLevel, riskDescription);
                }, NOTIFICATION_DELAY - (currentTime - lastNotificationTime));
                return;
            }

            /* Update last notification time */
            lastNotificationTime = currentTime;

            /* Create modal element */
            const modal = document.createElement("div");
            modal.className = "emergency-modal";
            modal.innerHTML = `
                <div class="modal-content">
                    <h3>🚨 Emergency Alert</h3>
                    <p><strong>Sensor:</strong> ${sensor.type}</p>
                    <p><strong>Location:</strong> ${sensor.location || building.location || "Unknown"}</p>
                    <p><strong>Building:</strong> ${sensor.buildingName || building.buildingName || "N/A"}</p>
                    <p><strong>Temperature:</strong> ${tempValue}°C</p>
                    <p><strong>Threshold Exceeded:</strong> ${triggeredRiskLevel.threshold}°C</p>
                    <p><strong>Risk Level:</strong> Level ${triggeredRiskLevel.level}</p>
                    <p><strong>Description:</strong> ${riskDescription || "No description provided"}</p>
                    <button class="modal-close-btn">Acknowledge</button>
                </div>
            `;
            /* Append modal to body */
            document.body.appendChild(modal);

            /* Add close button event listener */
            const closeBtn = modal.querySelector(".modal-close-btn");
            closeBtn.addEventListener("click", () => {
                modal.remove();
            });
        }

        /* Function to load and display sensors */
        function loadSensors(userEmail, displayMode, filter = "all", searchQuery = "") {
            /* Get sensor list container and header */
            const container = document.getElementById("sensorList");
            const sensorHeader = document.getElementById("sensorHeader");
            /* Hide sensors if in cameras-only mode */
            if (displayMode === "cameras") {
                container.style.display = "none";
                return;
            }
            /* Show sensor list */
            container.style.display = "flex";
            /* Display loading message */
            container.innerHTML = '<p class="loading">Loading Sensors...</p>';

            /* Query buildings added by the user */
            const q = query(collection(db, "buildings"), where("addedBy", "==", userEmail));
            /* Listen for real-time updates */
            onSnapshot(q, (snapshot) => {
                let sensorsHTML = "";
                let sensorCount = 0;

                snapshot.forEach((doc) => {
                    const building = doc.data();
                    /* Ensure sensors is an array */
                    let sensorsArray = Array.isArray(building.sensors) ? building.sensors : Object.values(building.sensors || {});
                    sensorsArray.forEach((sensor) => {
                        /* Limit sensors in non-sensor mode */
                        if (displayMode !== "sensors" && sensorCount >= 10) return;
                        /* Apply status filter */
                        if (filter !== "all" && sensor.status !== filter) return;
                        /* Apply search filter */
                        const searchString = `${sensor.type} ${sensor.location || ''} ${sensor.riskLevels?.map(r => r.level).join(' ') || ''}`.toLowerCase();
                        if (searchQuery && !searchString.includes(searchQuery.toLowerCase())) return;

                        /* Store heat sensor data */
                        if (sensor.source === "house/temp") {
                            heatSensorData = { sensor, building, docId: doc.id };
                        }

                        /* Determine highest risk level */
                        const highestRiskLevel = sensor.riskLevels && sensor.riskLevels.length > 0
                            ? Math.max(...sensor.riskLevels.map(r => r.level))
                            : 1;
                        const state = highestRiskLevel >= 3 ? "Danger" : "Normal";
                        /* Format risk levels text */
                        const riskLevelsText = sensor.riskLevels && sensor.riskLevels.length > 0
                            ? sensor.riskLevels.map(r => `Level ${r.level} (${r.description || "No description"})`).join(', ')
                            : "Unknown";
                        const connectionType = sensor.connections ? Object.keys(sensor.connections)[0] || "N/A" : "N/A";

                        /* Determine sensor status */
                        const isActive = sensor.status === "active";
                        const statusColor = isActive ? "green" : "red";
                        const toggleChecked = isActive ? "checked" : "";

                        /* Add sensor HTML */
                        sensorsHTML += `
                            <div class="sensor-item ${sensor.status || "unknown"} ${state.toLowerCase()}" style="background: rgba(${isActive ? '0, 255, 0, 0.1' : '255, 0, 0, 0.15'}); border-left: 4px solid ${statusColor};">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                    <div>
                                        <strong>${sensor.type} Sensor</strong> - Location: ${sensor.location || building.location || "Unknown"}<br>
                                        Building: ${sensor.buildingName || building.buildingName || "N/A"} | Floor: ${sensor.floor || "N/A"} | Zone: ${sensor.zone || "N/A"}<br>
                                        Status: ${sensor.status || "unknown"} | State: ${state} | Risk Levels: ${riskLevelsText}<br>
                                        Activated: ${sensor.activated ? "Yes" : "No"} | Connection: ${connectionType}<br>
                                        Configuration:
                                        <ul>
                                            <li>Threshold: ${sensor.riskLevels?.find(r => r.threshold)?.threshold || "N/A"}°C</li>
                                            <li>Last Reading: <span id="lastReading-${sensor.uniqueId}">${sensor.lastReading || "N/A"}</span></li>
                                            <li>Unique ID: ${sensor.uniqueId || "N/A"}</li>
                                        </ul>
                                    </div>
                                    <label class="toggle-switch">
                                        <input type="checkbox" class="status-toggle" data-unique-id="${sensor.uniqueId}" ${toggleChecked}>
                                        <span class="slider"></span>
                                    </label>
                                </div>
                            </div>`;
                        sensorCount++;

                        /* Notify if sensor is activated */
                        if (sensor.activated === true) {
                            notifyParty(sensor, building);
                        }
                    });
                });

                /* Update sensor header with count */
                sensorHeader.textContent = `Sensors (${displayMode === "sensors" ? sensorCount : 10})`;

                /* Add placeholders if needed */
                if (displayMode !== "sensors") {
                    while (sensorCount < 10) {
                        sensorsHTML += `
                            <div class="sensor-item unknown">
                                <strong>Sensor ${sensorCount + 1}</strong><br>
                                <p>No Sensor Assigned</p>
                            </div>`;
                        sensorCount++;
                    }
                }

                /* Update container with sensor HTML or fallback message */
                container.innerHTML = sensorsHTML || "<p>No sensors available</p>";

                /* Add event listeners for status toggles */
                document.querySelectorAll('.status-toggle').forEach(toggle => {
                    toggle.addEventListener('change', async function () {
                        const uniqueId = this.getAttribute('data-unique-id');
                        const newStatus = this.checked ? "active" : "inactive";
                        const newColor = this.checked ? "green" : "red";
                        const sensorItem = this.closest('.sensor-item');

                        /* Update sensor item styling */
                        sensorItem.style.background = `rgba(${this.checked ? '0, 255, 0, 0.1' : '255, 0, 0, 0.15'})`;
                        sensorItem.style.borderLeft = `4px solid ${newColor}`;

                        snapshot.forEach(async (docSnap) => {
                            const building = docSnap.data();
                            const sensorsArray = Array.isArray(building.sensors) ? building.sensors : Object.values(building.sensors || {});
                            const sensorToUpdate = sensorsArray.find(sensor => sensor.uniqueId === uniqueId);
                            if (sensorToUpdate) {
                                /* Update sensor status */
                                sensorToUpdate.status = newStatus;
                                const buildingRef = doc(db, "buildings", docSnap.id);
                                await updateDoc(buildingRef, {
                                    sensors: sensorsArray
                                });
                            }
                        });
                    });
                });

                /* Monitor temperature for heat sensor */
                if (heatSensorData) {
                    const tempRef = ref(rtdb, "house/temp");
                    onValue(tempRef, (snapshot) => {
                        const tempValue = snapshot.val();
                        const lastReadingElement = document.getElementById(`lastReading-${heatSensorData.sensor.uniqueId}`);
                        if (lastReadingElement) {
                            /* Update last reading display */
                            lastReadingElement.textContent = `${tempValue}°C`;
                        }

                        /* Skip if sensor is inactive */
                        if (heatSensorData.sensor.status !== "active") return;

                        /* Sort risk levels by threshold */
                        const sortedRiskLevels = heatSensorData.sensor.riskLevels
                            .filter(r => r.threshold)
                            .sort((a, b) => b.threshold - a.threshold);
                        const triggeredRiskLevel = sortedRiskLevels.find(r => tempValue > r.threshold);

                        /* Handle triggered risk level */
                        if (triggeredRiskLevel) {
                            showEmergencyModal(
                                heatSensorData.sensor,
                                heatSensorData.building,
                                tempValue,
                                triggeredRiskLevel,
                                triggeredRiskLevel.description
                            );
                            logExceedanceEvent(
                                heatSensorData.sensor,
                                heatSensorData.building,
                                tempValue,
                                auth.currentUser.email
                            );
                        }
                    });
                }
            }, (error) => {
                /* Handle errors during sensor loading */
                console.error("Error loading sensors:", error);
                container.innerHTML = `<p>Error loading sensors: ${error.message}</p>`;
            });
        }

        /* Function to set up event listeners for controls */
        function setupEventListeners() {
            const sensorFilter = document.getElementById("sensorFilter");
            const searchSensorInput = document.getElementById("searchSensorInput");
            const displayToggle = document.getElementById("displayToggle");
            let debounceTimeout;

            /* Handle sensor filter changes */
            sensorFilter.addEventListener("change", () => {
                loadSensors(auth.currentUser?.email, displayToggle.value, sensorFilter.value, searchSensorInput.value);
            });

            /* Handle search input with debounce */
            searchSensorInput.addEventListener("input", () => {
                clearTimeout(debounceTimeout);
                debounceTimeout = setTimeout(() => {
                    loadSensors(auth.currentUser?.email, displayToggle.value, sensorFilter.value, searchSensorInput.value);
                }, 300);
            });

            /* Handle display mode changes */
            displayToggle.addEventListener("change", () => {
                loadCameras(auth.currentUser?.email, displayToggle.value);
                loadSensors(auth.currentUser?.email, displayToggle.value, sensorFilter.value, searchSensorInput.value);
            });
        }

        /* Handle authentication state changes */
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    /* Check user trial status */
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    const userData = userDoc.data();
                    const trialStart = userData?.trialStart?.toDate();
                    const now = new Date();
                    const trialDays = 5;
                    const trialEnd = new Date(trialStart?.getTime() + trialDays * 24 * 60 * 60 * 1000);

                    /* Redirect if trial expired */
                    if (!userData?.subscribed && now > trialEnd) {
                        alert("Your 5-day trial has expired. Please subscribe to continue.");
                        window.location.href = 'payment.html';
                    } else {
                        /* Load cameras and sensors */
                        loadCameras(user.email, "both");
                        loadSensors(user.email, "both");
                        /* Set up control event listeners */
                        setupEventListeners();
                    }
                } catch (error) {
                    /* Handle errors during trial status check */
                    console.error("Error checking trial status:", error);
                }
            } else {
                /* Redirect to login if not authenticated */
                window.location.href = 'loginPage.html';
            }
        });
    </script>
    <style>

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

            /* Inner padding */

            /* Fix sidebar position */
            height: 100vh;

            /* Sidebar shadow */

        .sidebar nav ul {
            list-style: none;

            padding: 0;

        }

        /* Sidebar list items */
        .sidebar nav ul li {
            padding: 15px 0;
            /* Vertical padding */
            text-align: center;
            /* Center text */
        }

        /* Sidebar link styling */
        .sidebar nav ul li a {
            color: var(--primary-color);
            /* Link color */
            text-decoration: none;
            /* Remove underline */
            font-size: 18px;
            /* Font size */

            /* Bold text */

        /* Sidebar link hover effect */

        /* Main content area */

            margin-left: 300px;
            /* Offset for sidebar */

            /* Inner padding */
            width: calc(100% - 300px);
            /* Adjust width for sidebar */
            overflow-y: auto;
            /* Enable vertical scrolling */
        }

        /* Monitor container styling */
        .monitor-container {
            background: var(--card-bg);
            /* Card background */
            padding: 25px;
            /* Inner padding */

            /* Rounded corners */
            box-shadow: var(--card-shadow);
            /* Card shadow */
            max-width: 1400px;
            /* Maximum width */

            /* Center horizontally */

        /* Monitor container heading */
        .monitor-container h2 {
            text-align: center;
            /* Center text */

            /* Text shadow effect */
            margin-bottom: 20px;

        /* Camera grid layout */

            display: grid;
            /* Grid layout */
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            /* Responsive columns */
            gap: 15px;
            /* Gap between items */
            margin-top: 15px;
            /* Top margin */
        }

        /* Individual camera feed styling */
        .camera-feed {
            background: #000;
            /* Black background */
            border-radius: 10px;
            /* Rounded corners */
            padding: 10px;
            /* Inner padding */
        }

        /* Camera feed title */
        .camera-feed h4 {
            margin: 0 0 10px;
            /* Margin */
            font-size: 14px;
            /* Font size */
            text-align: center;
            /* Center text */
        }

        /* Camera feed iframe */
        .camera-feed iframe {
            border-radius: 8px;
            /* Rounded corners */
            width: 100%;
            /* Full width */
            height: 200px;
            /* Fixed height */
        }

        /* Camera feed placeholder */
        .camera-feed .placeholder {
            background: #333;
            /* Dark background */
            color: #fff;
            /* White text */
            text-align: center;
            /* Center text */
            padding: 80px 0;
            /* Vertical padding */
            border-radius: 8px;
            /* Rounded corners */
            height: 200px;
            /* Fixed height */
        }

        /* Camera feed info text */
        .camera-feed p {
            font-size: 12px;
            /* Font size */
            margin: 5px 0 0;
            /* Margin */
            text-align: center;
            /* Center text */
        }

        /* Sensor controls layout */
        .sensor-controls {
            display: flex;
            /* Flexbox layout */
            align-items: center;
            /* Vertical alignment */
            justify-content: center;
            /* Center horizontally */
            gap: 10px;
            /* Gap between items */
            margin: 15px 0;
            /* Vertical margin */
        }

        /* Sensor list layout */
        .sensor-list {
            display: flex;
            /* Flexbox layout */
            flex-direction: column;
            /* Vertical stacking */
            gap: 10px;
            /* Gap between items */
        }

        /* Individual sensor item */
        .sensor-item {
            background: var(--card-bg);
            /* Card background */
            padding: 15px;
            /* Inner padding */
            border-radius: 8px;
            /* Rounded corners */
            border-left: 4px solid transparent;
            /* Transparent left border */
        }

        /* Active sensor styling */
        .sensor-item.active {
            border-left-color: #00ff00;
            /* Green left border */
        }

        /* Inactive sensor styling */
        .sensor-item.inactive {
            border-left-color: var(--primary-color);
            /* Red left border */
        }

        /* Danger state sensor styling */
        .sensor-item.danger {
            background: rgba(255, 0, 0, 0.15);
            /* Semi-transparent red background */
        }

        /* Normal state sensor styling */
        .sensor-item.normal {
            background: rgba(0, 255, 0, 0.1);
            /* Semi-transparent green background */
        }

        /* Unknown state sensor styling */
        .sensor-item.unknown {
            border-left-color: #ff9900;
            /* Orange left border */
        }

        /* Sensor item list styling */
        .sensor-item ul {
            margin: 10px 0 0;
            /* Margin */
            padding-left: 20px;
            /* Left padding */
            font-size: 12px;
            /* Font size */
        }

        /* Select and input styling */
        select,
        input {
            padding: 8px;
            /* Inner padding */
            border-radius: 6px;
            /* Rounded corners */
            border: none;
            /* No border */
            background: var(--card-bg);
            /* Card background */
            color: #fff;
            /* Text color */
            font-size: 14px;
            /* Font size */
            transition: background 0.3s;
            /* Smooth background transition */
        }

        /* Select and input hover effect */
        select:hover,
        input:hover {
            background: rgba(255, 255, 255, 0.2);
            /* Lighter background on hover */
        }

        /* Select and input focus effect */
        select:focus,
        input:focus {
            background: rgba(255, 255, 6355, 0.2);
            /* Lighter background on focus */
            outline: none;
            /* Remove outline */
        }

        /* Label styling */
        label {
            font-size: 14px;
            /* Font size */
            font-weight: 700;
            /* Bold text */
        }

        /* Loading indicator pseudo-element */
        .loading::before {
            content: "";
            /* Empty content */
            display: inline-block;
            /* Inline-block display */
            width: 16px;
            /* Spinner size */
            height: 16px;
            /* Spinner size */
            border: 2px solid var(--primary-color);
            /* Border color */
            border-top-color: transparent;
            /* Transparent top border */
            border-radius: 50%;
            /* Circular shape */
            animation: spin 1s linear infinite;
            /* Spin animation */
            margin-right: 8px;
            /* Right margin */
        }

        /* Spin animation keyframes */
        @keyframes spin {
            to {
                transform: rotate(360deg);
                /* Full rotation */
            }
        }

        /* Toggle switch styling */
        .toggle-switch {
            position: relative;
            /* Relative positioning */
            display: inline-block;
            /* Inline-block display */
            width: 40px;
            /* Width */
            height: 20px;
            /* Height */
            margin-left: 10px;
            /* Left margin */
        }

        /* Toggle switch input styling */
        .toggle-switch input {
            opacity: 0;
            /* Hidden input */
            width: 0;
            /* Zero width */
            height: 0;
            /* Zero height */
        }

        /* Toggle switch slider */
        .slider {
            position: absolute;
            /* Absolute positioning */
            cursor: pointer;
            /* Pointer cursor */
            top: 0;
            /* Align to top */
            left: 0;
            /* Align to left */
            right: 0;
            /* Align to right */
            bottom: 0;
            /* Align to bottom */
            background-color: #ccc;
            /* Default background */
            transition: 0.4s;
            /* Smooth transition */
            border-radius: 20px;
            /* Rounded corners */
        }

        /* Toggle switch slider pseudo-element */
        .slider:before {
            position: absolute;
            /* Absolute positioning */
            content: "";
            /* Empty content */
            height: 16px;
            /* Height */
            width: 16px;
            /* Width */
            left: 2px;
            /* Left offset */
            bottom: 2px;
            /* Bottom offset */
            background-color: white;
            /* White background */
            transition: 0.4s;
            /* Smooth transition */
            border-radius: 50%;
            /* Circular shape */
        }

        /* Checked toggle switch styling */
        input:checked+.slider {
            background-color: #00ff00;
            /* Green background */
        }

        /* Checked toggle switch slider position */
        input:checked+.slider:before {
            transform: translateX(20px);
            /* Move slider to right */
        }

        /* Unchecked toggle switch styling */
        input:not(:checked)+.slider {
            background-color: #ff0000;
            /* Red background */
        }

        /* Modal Styles */
        /* Emergency modal overlay */
        .emergency-modal {
            position: fixed;
            /* Fixed positioning */
            top: 0;
            /* Align to top */
            left: 0;
            /* Align to left */
            width: 100%;
            /* Full width */
            height: 100%;
            /* Full height */
            background: rgba(0, 0, 0, 0.7);
            /* Semi-transparent background */
            display: flex;
            /* Flexbox layout */
            justify-content: center;
            /* Center horizontally */
            align-items: center;
            /* Center vertically */
            z-index: 1000;
            /* High z-index */
        }

        /* Modal content styling */
        .modal-content {
            background: rgba(255, 0, 0, 0.9);
            /* Semi-transparent red background */
            padding: 20px;
            /* Inner padding */
            border-radius: 10px;
            /* Rounded corners */
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            /* Shadow effect */
            max-width: 400px;
            /* Maximum width */
            width: 90%;
            /* Responsive width */
            text-align: center;
            /* Center text */
            color: #fff;
            /* White text */
            animation: slideIn 0.3s ease;
            /* Slide-in animation */
        }

        /* Modal heading */
        .modal-content h3 {
            margin: 0 0 15px;
            /* Margin */
            font-size: 24px;
            /* Font size */
            text-shadow: 0 0 5px #fff;
            /* Text shadow */
        }

        /* Modal paragraphs */
        .modal-content p {
            margin: 5px 0;
            /* Margin */
            font-size: 14px;
            /* Font size */
        }

        /* Modal close button */
        .modal-close-btn {
            margin-top: 20px;
            /* Top margin */
            padding: 10px 20px;
            /* Padding */
            background: #fff;
            /* White background */
            color: #ff0000;
            /* Red text */
            border: none;
            /* No border */
            border-radius: 5px;
            /* Rounded corners */
            font-size: 16px;
            /* Font size */
            cursor: pointer;
            /* Pointer cursor */
            transition: background 0.3s;
            /* Smooth background transition */
        }

        /* Modal close button hover effect */
        .modal-close-btn:hover {
            background: #ddd;
            /* Light gray background */
        }

        /* Slide-in animation keyframes */
        @keyframes slideIn {
            from {
                transform: translateY(-50px);
                /* Start above */
                opacity: 0;
                /* Start invisible */
            }

            to {
                transform: translateY(0);
                /* End at normal position */
                opacity: 1;
                /* End fully visible */
            }
        }

        /* Responsive design for smaller screens */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
                /* Stack elements vertically */
            }

            .sidebar {
                width: 100%;
                /* Full width */
                height: auto;
                /* Auto height */
                position: static;
                /* Remove fixed positioning */
                border-right: none;
                /* Remove right border */
                border-bottom: 2px solid var(--primary-color);
                /* Add bottom border */
                box-shadow: none;
                /* Remove shadow */
            }

            .content {
                margin-left: 0;
                /* Remove sidebar offset */
                width: 100%;
                /* Full width */
                padding: 20px;
                /* Reduced padding */
            }

            .camera-grid {
                grid-template-columns: 1fr;
                /* Single column */
            }

            .monitor-container {
                padding: 15px;
                /* Reduced padding */
            }
        }
    </style>
</head>
