        function convertToEmbedUrl(url) {
            if (!url) return null;
            if (url.includes('youtube.com/embed/')) return url;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
            const match = url.match(regExp);
            const videoId = (match && match[2].length === 11) ? match[2] : null;
            return videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=1` : url;
        }

        const isValidURL = (url) => {
            try {
                new URL(url);
                return url.startsWith("https://") || url.startsWith("http://") ||
                    url.startsWith("rtsp://") || url.startsWith("ws://") ||
                    url.startsWith("wss://");
            } catch {
                return false;
            }
        };

        function notifyParty(sensor, building) {
            const sensorId = sensor.uniqueId || `${sensor.type}-${sensor.location || 'unknown'}`;
            if (notifiedSensors.has(sensorId)) return;

            const contacts = building.contacts || {};
            const contactEmail = contacts.email || "admin@example.com";
            const contactPhone = contacts.phone || "+1234567890";
            const highestRiskLevel = sensor.riskLevels && sensor.riskLevels.length > 0
                ? Math.max(...sensor.riskLevels.map(r => r.level))
                : 1;

            let notificationMethod = "Email";
            let notificationMessage = `Sensor Alert: ${sensor.type} at ${sensor.location || building.location || "Unknown"} (Building: ${building.buildingName || "N/A"}) - Highest Risk Level: ${highestRiskLevel}`;

            if (highestRiskLevel >= 3) {
                notificationMethod = "Email and SMS (High Priority)";
                notificationMessage += " - Immediate action required!";
            } else if (highestRiskLevel === 2) {
                notificationMethod = "Email (Medium Priority)";
                notificationMessage += " - Please review.";
            } else {
                notificationMethod = "Email (Low Priority)";
                notificationMessage += " - For your information.";
            }

            console.log(`Notifying party via ${notificationMethod} to ${contactEmail}${contactPhone ? ` and ${contactPhone}` : ''}: ${notificationMessage}`);
            notifiedSensors.add(sensorId);
        }

        function updateHouseDataUI(houseData) {
            const sensorItems = document.querySelectorAll('.sensor-item');

                const sensorType = item.querySelector('strong')?.textContent?.toLowerCase();

                        readingElement.textContent = `Last Reading: ${houseData.temp}°C`;

                    if (readingElement && houseData.humidity !== undefined) {
                        readingElement.textContent = `Last Reading: ${houseData.humidity}%`;

                if (sensorType && sensorType.includes('gas')) {
                    const readingElement = item.querySelector('ul li:nth-child(2)');
                    if (readingElement && houseData['gas-leak'] !== undefined) {
                        const status = houseData['gas-leak'] ? 'DETECTED' : 'Normal';

                        readingElement.textContent = `Last Reading: ${status}`;

                        if (houseData['gas-leak']) {

                                statusText.textContent = statusText.textContent.replace(/Status: \w+/, 'Status: ALERT');
                            }

        }

        function listenToRealtimeData(userEmail) {
            const sensorsRef = ref(realtimeDb, 'sensors');
            onValue(sensorsRef, (snapshot) => {
                const sensorData = snapshot.val();
                if (sensorData) {
                    Object.entries(sensorData).forEach(([uniqueId, data]) => {
                        if (data.addedBy === userEmail) {
                            updateSensorStatusUI(uniqueId, data.lastReading, data.status);
                        }
                    });
                }
            }, (error) => {
                console.error("Error listening to sensor status:", error);
            });

            const houseRef = ref(realtimeDb, 'house');
            onValue(houseRef, (snapshot) => {
                const houseData = snapshot.val();
                if (houseData) {
                    updateHouseDataUI(houseData);
                }
            }, (error) => {
                console.error("Error listening to house data:", error);
            });
        }

        function setupEventListeners() {
            const sensorFilter = document.getElementById("sensorFilter");
            const searchSensorInput = document.getElementById("searchSensorInput");
            const displayToggle = document.getElementById("displayToggle");
            let debounceTimeout;

            sensorFilter.addEventListener("change", () => {
                loadSensors(auth.currentUser?.email, displayToggle.value, sensorFilter.value, searchSensorInput.value);
            });

            searchSensorInput.addEventListener("input", () => {
                clearTimeout(debounceTimeout);
                debounceTimeout = setTimeout(() => {
                    loadSensors(auth.currentUser?.email, displayToggle.value, sensorFilter.value, searchSensorInput.value);
                }, 300);
            });

            displayToggle.addEventListener("change", () => {
                loadCameras(auth.currentUser?.email, displayToggle.value);
                loadSensors(auth.currentUser?.email, displayToggle.value, sensorFilter.value, searchSensorInput.value);
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    const userData = userDoc.data();
                    const trialStart = userData?.trialStart?.toDate();
                    const now = new Date();
                    const trialDays = 5;
                    const trialEnd = new Date(trialStart?.getTime() + trialDays * 24 * 60 * 60 * 1000);

                    if (!userData?.subscribed && now > trialEnd) {
                        alert("Your 5-day trial has expired. Please subscribe to continue.");
                        window.location.href = 'payment.html';
                    } else {
                        loadCameras(user.email, "both");
                        loadSensors(user.email, "both");
                        listenToRealtimeData(user.email);
                        setupEventListeners();
                    }
                } catch (error) {
                    console.error("Error checking trial status:", error);
                }
            } else {
                window.location.href = 'loginPage.html';
            }
        });
