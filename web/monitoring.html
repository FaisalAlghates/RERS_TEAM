<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring | RERS System</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAurJx-nSpVdj0ctPx8agoIIVTi8k3Wtpg",
            authDomain: "rersweb.firebaseapp.com",
            projectId: "rersweb",
            storageBucket: "rersweb.firebasestorage.app",
            messagingSenderId: "432558250053",
            appId: "1:432558250053:web:07fc91665244a2d93feb2c"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Load cameras from Firestore
        async function loadCameras() {
            const camerasContainer = document.getElementById("cameraGrid");
            camerasContainer.innerHTML = "<p>Loading Cameras...</p>";

            try {
                const querySnapshot = await getDocs(collection(db, "buildings"));
                let camerasHTML = "";
                querySnapshot.forEach((doc) => {
                    const building = doc.data();
                    if (building.cameras) {
                        building.cameras.forEach((camera) => {
                            if (camera.primaryCamera) {
                                camerasHTML += `
                                    <div class="camera-feed">
                                        <h4>${camera.name || "Primary Camera"} (${camera.location || "Unknown"})</h4>
                                        <iframe src="${camera.cameraURL}" width="100%" height="250px" frameborder="0" allowfullscreen></iframe>
                                    </div>`;
                            }
                        });
                    }
                });
                camerasContainer.innerHTML = camerasHTML || "<p>No primary cameras available</p>";
            } catch (error) {
                console.error("Error loading cameras:", error);
                camerasContainer.innerHTML = "<p>Error loading cameras</p>";
            }
        }

        // Load sensors from Firestore
        async function loadSensors(filter = "all", searchQuery = "") {
            const sensorList = document.getElementById("sensorList");
            sensorList.innerHTML = "<p>Loading Sensors...</p>";

            try {
                const querySnapshot = await getDocs(collection(db, "buildings"));
                let sensorsHTML = "";
                querySnapshot.forEach((doc) => {
                    const building = doc.data();
                    if (building.sensors) {
                        building.sensors.forEach((sensor) => {
                            if (sensor.primarySensor) {
                                // Apply filter
                                if (filter !== "all" && sensor.status !== filter) return;

                                // Apply search
                                const searchString = `${sensor.type} ${sensor.location} ${sensor.riskLevel}`.toLowerCase();
                                if (searchQuery && !searchString.includes(searchQuery.toLowerCase())) return;

                                // Determine danger/normal state
                                const state = sensor.riskLevel === "high" ? "Danger" : "Normal";

                                sensorsHTML += `
                                    <div class="sensor-item ${sensor.status} ${state.toLowerCase()}">
                                        <strong>${sensor.type} Sensor</strong> - Location: ${sensor.location}<br>
                                        Status: ${sensor.status} | State: ${state} | Risk Level: ${sensor.riskLevel}<br>
                                        Activated: ${sensor.activated ? "Yes" : "No"}<br>
                                        Configuration: 
                                        <ul>
                                            <li>Threshold: ${sensor.threshold || "N/A"}</li>
                                            <li>Last Reading: ${sensor.lastReading || "N/A"}</li>
                                            <li>Other: ${JSON.stringify(sensor.otherConfig || {}, null, 2)}</li>
                                        </ul>
                                    </div>`;
                            }
                        });
                    }
                });
                sensorList.innerHTML = sensorsHTML || "<p>No primary sensors available</p>";
            } catch (error) {
                console.error("Error loading sensors:", error);
                sensorList.innerHTML = "<p>Error loading sensors</p>";
            }
        }

        // Event listeners for filter and search
        function setupEventListeners() {
            const sensorFilter = document.getElementById("sensorFilter");
            const searchSensorInput = document.getElementById("searchSensorInput");

            sensorFilter.addEventListener("change", () => {
                loadSensors(sensorFilter.value, searchSensorInput.value);
            });

            searchSensorInput.addEventListener("input", () => {
                loadSensors(sensorFilter.value, searchSensorInput.value);
            });
        }

        // Load cameras & sensors on page load
        window.onload = () => {
            loadCameras();
            loadSensors();
            setupEventListeners();
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, rgba(10, 10, 10, 1) 10%, rgba(0, 0, 0, 1) 80%);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #2a2a2a, #000);
            padding: 20px;
            position: fixed;
            height: 100vh;
            box-shadow: 4px 0 15px rgba(255, 0, 0, 0.5);
            border-right: 2px solid #ff0000;
        }
        .sidebar nav ul {
            list-style: none;
            padding: 0;
        }
        .sidebar nav ul li {
            padding: 15px 0;
            text-align: center;
        }
        .sidebar nav ul li a {
            color: #ff0000;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            display: block;
            padding: 10px;
            border-radius: 5px;
        }
        .content {
            margin-left: 270px;
            padding: 40px;
            width: calc(100% - 270px);
            text-align: center;
            overflow-y: auto;
        }
        .monitor-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            width: 95%;
            max-width: 1400px;
            margin: auto;
        }
        .camera-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            margin-top: 20px;
        }
        .camera-feed {
            background: black;
            width: 100%;
            height: 300px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .camera-feed h4 {
            margin: 0 0 10px;
            font-size: 16px;
        }
        .sensor-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .sensor-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .sensor-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: left;
        }
        .sensor-item.active {
            border-left: 4px solid #00ff00;
        }
        .sensor-item.inactive {
            border-left: 4px solid #ff0000;
        }
        .sensor-item.danger {
            background: rgba(255, 0, 0, 0.2);
        }
        .sensor-item.normal {
            background: rgba(0, 255, 0, 0.1);
        }
        .sensor-item ul {
            margin: 10px 0 0 20px;
            padding: 0;
        }
        .sensor-item li {
            list-style: disc;
        }
        select, input {
            padding: 10px;
            border-radius: 8px;
            font-size: 16px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 220px;
            transition: all 0.3s ease;
        }
        select:hover, input:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        select option {
            background: #333;
            color: #fff;
        }
        input:focus {
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }
        label {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <nav>
            <ul>
                <li><a href="../web/dashboard.htm">Dashboard</a></li>
                <li><a href="../web/add_building.htm">Add Buildings</a></li>
                <li><a href="../web/monitoring.html">Monitoring</a></li>
                <li><a href="../web/reports.html">Reports</a></li>
                <li><a href="../web/payment.htm">Payment</a></li>
                <li><a href="../web/US.htm">About Us</a></li>
                <li><a href="../web/logout.htm">Logout</a></li>
            </ul>
        </nav>
    </aside>
    
    <div class="content">
        <div class="monitor-container">
            <h2>Monitoring Dashboard</h2>

            <h3>Live Primary Cameras</h3>
            <div class="camera-grid" id="cameraGrid">
                <p>Loading Cameras...</p>
            </div>
            
            <h3>Primary Sensors</h3>
            <div class="sensor-controls">
                <label for="sensorFilter">Filter:</label>
                <select id="sensorFilter">
                    <option value="all">All Sensors</option>
                    <option value="active">Active Sensors</option>
                    <option value="inactive">Inactive Sensors</option>
                </select>
                <label for="searchSensorInput">Search:</label>
                <input type="text" id="searchSensorInput" placeholder="Search for a sensor..." />
            </div>
            
            <div class="sensor-list" id="sensorList">
                <p>Loading Sensors...</p>
            </div>
        </div>
    </div>
</body>
</html>
