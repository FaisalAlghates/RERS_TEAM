<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring | RERS System</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAurJx-nSpVdj0ctPx8agoIIVTi8k3Wtpg",
            authDomain: "rersweb.firebaseapp.com",
            projectId: "rersweb",
            storageBucket: "rersweb.firebasestorage.app",
            messagingSenderId: "432558250053",
            appId: "1:432558250053:web:07fc91665244a2d93feb2c"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Cache for cameras and sensors
        let cachedCameras = null;
        let cachedSensors = null;

        // Validate camera URL
        const isValidURL = (url) => {
            try {
                new URL(url);
                return url.startsWith("https://");
            } catch {
                return false;
            }
        };

        // Load cameras from Firestore
        async function loadCameras() {
            const camerasContainer = document.getElementById("cameraGrid");
            camerasContainer.innerHTML = '<p class="loading">Loading Cameras...</p>';

            if (cachedCameras) {
                camerasContainer.innerHTML = cachedCameras;
                return;
            }

            try {
                const querySnapshot = await getDocs(collection(db, "buildings"));
                let camerasHTML = "";
                querySnapshot.forEach((doc) => {
                    const building = doc.data();

                    // Check for top-level url and isPrimary as a fallback
                    if (building.url && building.isPrimary && isValidURL(building.url)) {
                        camerasHTML += `
                            <div class="camera-feed">
                                <h4>Main Camera (${building.location || "Unknown"})</h4>
                                <iframe src="${building.url}" width="100%" height="250px" frameborder="0" allowfullscreen></iframe>
                            </div>`;
                    }

                    // Check for cameras array (original logic)
                    if (building.cameras && Array.isArray(building.cameras)) {
                        building.cameras.forEach((camera) => {
                            if (camera.primaryCamera && isValidURL(camera.cameraURL)) {
                                camerasHTML += `
                                    <div class="camera-feed">
                                        <h4>${camera.name || "Primary Camera"} (${camera.location || "Unknown"})</h4>
                                        <iframe src="${camera.cameraURL}" width="100%" height="250px" frameborder="0" allowfullscreen></iframe>
                                    </div>`;
                            }
                        });
                    }
                });
                cachedCameras = camerasHTML || "<p>No primary cameras available</p>";
                camerasContainer.innerHTML = cachedCameras;
            } catch (error) {
                console.error("Error loading cameras:", error);
                camerasContainer.innerHTML = `<p>Error loading cameras: ${error.message}</p>`;
            }
        }

        // Load sensors from Firestore
        async function loadSensors(filter = "all", searchQuery = "") {
            const sensorList = document.getElementById("sensorList");
            sensorList.innerHTML = '<p class="loading">Loading Sensors...</p>';

            if (cachedSensors && filter === "all" && !searchQuery) {
                sensorList.innerHTML = cachedSensors;
                return;
            }

            try {
                const querySnapshot = await getDocs(collection(db, "buildings"));
                let sensorsHTML = "";
                querySnapshot.forEach((doc) => {
                    const building = doc.data();

                    // Convert sensors object to array if necessary
                    let sensorsArray = [];
                    if (building.sensors) {
                        if (Array.isArray(building.sensors)) {
                            sensorsArray = building.sensors;
                        } else if (typeof building.sensors === "object") {
                            sensorsArray = Object.values(building.sensors);
                        }
                    }

                    if (sensorsArray.length > 0) {
                        sensorsArray.forEach((sensor) => {
                            // Map isPrimary to primarySensor
                            const isPrimarySensor = sensor.isPrimary !== undefined ? sensor.isPrimary : sensor.primarySensor;

                            if (isPrimarySensor) {
                                // Apply filter
                                if (filter !== "all" && sensor.status !== filter) return;

                                // Apply search
                                const searchString = `${sensor.type} ${sensor.location} ${sensor.riskLevel}`.toLowerCase();
                                if (searchQuery && !searchString.includes(searchQuery.toLowerCase())) return;

                                // Determine danger/normal state
                                const riskLevel = sensor.riskLevel === 1 ? "low" : sensor.riskLevel; // Map numeric riskLevel to string
                                const state = riskLevel === "high" ? "Danger" : "Normal";

                                sensorsHTML += `
                                    <div class="sensor-item ${sensor.status || "unknown"} ${state.toLowerCase()}">
                                        <strong>${sensor.type} Sensor</strong> - Location: ${sensor.location || building.location || "Unknown"}<br>
                                        Status: ${sensor.status || "unknown"} | State: ${state} | Risk Level: ${riskLevel}<br>
                                        Activated: ${sensor.activated !== undefined ? (sensor.activated ? "Yes" : "No") : "N/A"}<br>
                                        Configuration: 
                                        <ul>
                                            <li>Threshold: ${sensor.threshold || "N/A"}</li>
                                            <li>Last Reading: ${sensor.lastReading || "N/A"}</li>
                                            <li>Other: ${JSON.stringify(sensor.otherConfig || {}, null, 2)}</li>
                                        </ul>
                                    </div>`;
                            }
                        });
                    }
                });
                cachedSensors = sensorsHTML || "<p>No primary sensors available</p>";
                sensorList.innerHTML = sensorsHTML || "<p>No primary sensors available</p>";
            } catch (error) {
                console.error("Error loading sensors:", error);
                sensorList.innerHTML = `<p>Error loading sensors: ${error.message}</p>`;
            }
        }

        // Event listeners for filter and search
        function setupEventListeners() {
            const sensorFilter = document.getElementById("sensorFilter");
            const searchSensorInput = document.getElementById("searchSensorInput");
            let debounceTimeout;

            sensorFilter.addEventListener("change", () => {
                loadSensors(sensorFilter.value, searchSensorInput.value);
            });

            searchSensorInput.addEventListener("input", () => {
                clearTimeout(debounceTimeout);
                debounceTimeout = setTimeout(() => {
                    loadSensors(sensorFilter.value, searchSensorInput.value);
                }, 300);
            });
        }

        // Load cameras & sensors on page load
        window.onload = () => {
            loadCameras();
            loadSensors();
            setupEventListeners();
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, rgba(10, 10, 10, 1) 10%, rgba(0, 0, 0, 1) 80%);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            background: linear-gradient(180deg, #2a2a2a, #000);
            padding: 20px;
            position: fixed;
            height: 100vh;
            box-shadow: 4px 0 15px rgba(255, 0, 0, 0.5);
            border-right: 2px solid #ff0000;
        }
        .sidebar nav ul {
            list-style: none;
            padding: 0;
        }
        .sidebar nav ul li {
            padding: 15px 0;
            text-align: center;
        }
        .sidebar nav ul li a {
            color: #ff0000;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            display: block;
            padding: 10px;
            border-radius: 5px;
        }
        .content {
            margin-left: 270px;
            padding: 40px;
            width: calc(100% - 270px);
            text-align: center;
            overflow-y: auto;
        }
        .monitor-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            width: 95%;
            max-width: 1400px;
            margin: auto;
        }
        .camera-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            width: 100%;
            margin-top: 20px;
        }
        .camera-feed {
            background: black;
            width: 100%;
            height: 300px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        .camera-feed h4 {
            margin: 0 0 10px;
            font-size: 16px;
        }
        .sensor-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .sensor-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }
        .sensor-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            text-align: left;
        }
        .sensor-item.active {
            border-left: 4px solid #00ff00;
        }
        .sensor-item.inactive {
            border-left: 4px solid #ff0000;
        }
        .sensor-item.danger {
            background: rgba(255, 0, 0, 0.2);
        }
        .sensor-item.normal {
            background: rgba(0, 255, 0, 0.1);
        }
        .sensor-item.unknown {
            border-left: 4px solid #ff9900; /* Orange for unknown status */
        }
        .sensor-item ul {
            margin: 10px 0 0 20px;
            padding: 0;
        }
        .sensor-item li {
            list-style: disc;
        }
        select, input {
            padding: 10px;
            border-radius: 8px;
            font-size: 16px;
            border: none;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 220px;
            transition: all 0.3s ease;
        }
        select:hover, input:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        select option {
            background: #333;
            color: #fff;
        }
        input:focus {
            background: rgba(255, 255, 255, 0.3);
            outline: none;
        }
        label {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
        .loading::before {
            content: "";
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #ff0000;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .camera-grid p, .sensor-list p {
            color: #ff0000;
            font-size: 18px;
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
        @media (max-width: 768px) {
            .camera-grid {
                grid-template-columns: 1fr;
            }
            .content {
                margin-left: 0;
                width: 100%;
                padding: 20px;
            }
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                box-shadow: none;
                border-bottom: 2px solid #ff0000;
                border-right: none;
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <nav>
            <ul>
                <li><a href="../web/dashboard.htm">Dashboard</a></li>
                <li><a href="../web/add_building.htm">Add Buildings</a></li>
                <li><a href="../web/monitoring.html">Monitoring</a></li>
                <li><a href="../web/reports.html">Reports</a></li>
                <li><a href="../web/payment .htm">Payment</a></li>
                <li><a href="../web/US.htm">About Us</a></li>
                <li><a href="../web/logout.htm">Logout</a></li>
            </ul>
        </nav>
    </aside>
    
    <div class="content">
        <div class="monitor-container">
            <h2>Monitoring Dashboard</h2>

            <h3>Live Primary Cameras</h3>
            <div class="camera-grid" id="cameraGrid">
                <p class="loading">Loading Cameras...</p>
            </div>
            
            <h3>Primary Sensors</h3>
            <div class="sensor-controls">
                <label for="sensorFilter">Filter:</label>
                <select id="sensorFilter">
                    <option value="all">All Sensors</option>
                    <option value="active">Active Sensors</option>
                    <option value="inactive">Inactive Sensors</option>
                </select>
                <label for="searchSensorInput">Search:</label>
                <input type="text" id="searchSensorInput" placeholder="Search for a sensor..." />
            </div>
            
            <div class="sensor-list" id="sensorList">
                <p class="loading">Loading Sensors...</p>
            </div>
        </div>
    </div>
</body>
</html>
