<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RERS System</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');

        :root {
            --primary-color: #ff0000;
            --bg-gradient: radial-gradient(circle, rgba(10, 10, 10, 1) 10%, rgba(0, 0, 0, 1) 80%);
            --sidebar-gradient: linear-gradient(180deg, #2a2a2a, #000);
            --card-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background: var(--sidebar-gradient);
            padding: 20px;
            position: fixed;
            height: 100vh;
            box-shadow: 4px 0 15px rgba(255, 0, 0, 0.5);
            border-right: 2px solid var(--primary-color);
        }

        .sidebar nav ul {
            list-style: none;
            padding: 0;
        }

        .sidebar nav ul li {
            padding: 15px 0;
            text-align: center;
        }

        .sidebar nav ul li a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            display: block;
            padding: 10px;
            border-radius: 5px;
        }

        .sidebar nav ul li a:hover {
            background: rgba(255, 0, 0, 0.2);
            color: #fff;
        }

        .content {
            margin-left: 270px;
            padding: 40px;
            width: calc(100% - 270px);
            text-align: center;
        }

        #clock-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
            margin-top: 50px;
        }

        #clock {
            font-size: 160px;
            color: var(--primary-color);
            text-shadow: 0 0 40px rgba(255, 0, 0, 1),
                0 0 60px rgba(255, 0, 0, 0.8),
                0 0 80px rgba(255, 0, 0, 0.6),
                0 0 100px rgba(255, 0, 0, 0.4);
            font-family: 'Orbitron', sans-serif;
            display: block;
            letter-spacing: 10px;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.05);
            }
        }

        .glow {
            position: absolute;
            bottom: 10%;
            width: 100%;
            height: 80px;
            background: radial-gradient(circle, rgba(255, 0, 0, 0.9) 10%, rgba(0, 0, 0, 0) 80%);
            filter: blur(30px);
        }

        .loading {
            display: none;
            font-size: 16px;
            color: var(--primary-color);
        }

        .loading::before {
            content: "";
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--primary-color);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <aside class="sidebar">
        <nav>
            <ul>
                <li><a href="../web/dashboard.htm">dashboard</a></li>
                <li><a href="../web/add_building.htm">Add Buildings</a></li>
                <li><a href="../web/monitoring.html">Monitoring</a></li>
                <li><a href="../web/reports.html">Reports</a></li>
                <li><a href="../web/payment.htm">Payment</a></li>
                <li><a href="../web/US.htm">About Us</a></li>
                <li><a href="../web/logout.htm">Logout</a></li>
            </ul>
        </nav>
    </aside>

    <main class="content">
        <section id="dashboard">
            <h1>Welcome to RERS System</h1>
            <p id="userGreeting">Monitor and manage your emergency response efficiently.</p>
            <p class="loading" id="loading">Loading user data...</p>
        </section>

        <section id="clock-container">
            <span id="clock"></span>
            <div class="glow"></div>
        </section>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAurJx-nSpVdj0ctPx8agoIIVTi8k3Wtpg",
            authDomain: "rersweb.firebaseapp.com",
            projectId: "rersweb",
            storageBucket: "rersweb.firebasestorage.app",
            messagingSenderId: "432558250053",
            appId: "1:432558250053:web:07fc91665244a2d93feb2c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            const loading = document.getElementById("loading");
            const userGreeting = document.getElementById("userGreeting");

            loading.style.display = "block";

            if (user) {
                try {
                    const userDoc = await getDoc(doc(db, "users", user.uid));
                    if (userDoc.exists()) {
                        const userData = userDoc.data();
                        userGreeting.textContent = `Welcome, ${userData.name}! Monitor and manage your emergency response efficiently.`;
                    } else {
                        userGreeting.textContent = "User profile not found.";
                    }
                } catch (error) {
                    console.error("Error fetching user data:", error);
                    userGreeting.textContent = "Error loading user profile.";
                }
            } else {
                history.pushState({}, '', '../web/login Page.html');
                window.location.href = '../web/login Page.html';
            }

            loading.style.display = "none";
        });

        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>

</html>
